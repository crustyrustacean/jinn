# Test timeout for rstest-generated tests. rstest reads this variable at
# COMPILE TIME (the proc macro bakes Duration::from_secs(N) into each test
# body), so it must be present for every rustc invocation — hence here,
# where cargo injects it into every build, rather than an entrypoint-only
# justfile export. 10 seconds bounds any single test from any entrypoint
# (just test, plain cargo test, rust-analyzer, CI).
[env]
RSTEST_TIMEOUT = "10"

# Link with mold (fast ELF linker) via clang. Applies to dev, test, and
# release link steps; cuts the final-link seconds off every build.
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=mold"]
