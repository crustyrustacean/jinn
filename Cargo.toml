[package]
name = "nullslop"
version = "0.1.0"
edition = "2024"
resolver = "3"
default-run = "nullslop"

[workspace]
members = ["crates/common/*", "crates/slices/*", "tests/*"]

[lib]
path = "src/lib.rs"

[dependencies]
nullslop-cli = { workspace = true }
nullslop-core = { workspace = true }
nullslop-intent = { workspace = true }
nullslop-tui = { workspace = true }
nullslop-services = { workspace = true }
nullslop-providers = { workspace = true }
nullslop-component = { workspace = true }
nullslop-actor-host = { workspace = true }
nullslop-actor = { workspace = true }
nsslice-echo = { workspace = true }
nsslice-shutdown = { workspace = true }
nsslice-llm = { workspace = true }
nsslice-context = { workspace = true }
nsslice-context-protocol = { workspace = true }
nullslop-prompt-template = { workspace = true }
nsslice-tools = { workspace = true }
nsslice-provider-protocol = { workspace = true }
nsslice-status-bar = { workspace = true }
nsslice-char-counter = { workspace = true }
nsslice-dashboard = { workspace = true }
nsslice-chat-log = { workspace = true }
nsslice-provider = { workspace = true }
nsslice-pinned-panel = { workspace = true }
nsslice-chat-input-box = { workspace = true }
nsslice-picker = { workspace = true }
nsslice-chat-entry-selection = { workspace = true }
nsslice-navigation = { workspace = true }
nsslice-session-management = { workspace = true }
nsslice-session-management-protocol = { workspace = true }
nsslice-global = { workspace = true }
tokio = { workspace = true }
kanal = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
clap-verbosity-flag = { workspace = true }
ratatui-which-key = { workspace = true }
ratatui-spatial-splits = { workspace = true }
nullslop-protocol = { workspace = true, features = ["which-key"] }
tempfile = { workspace = true }
dotenvy = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }

[workspace.dependencies]
# Internal
nsslice-context = { path = "crates/slices/nsslice-context" }
nsslice-context-protocol = { path = "crates/slices/nsslice-context-protocol" }
nullslop-prompt-template = { path = "crates/common/nullslop-prompt-template" }
nullslop-protocol = { path = "crates/common/nullslop-protocol" }
nullslop-core = { path = "crates/common/nullslop-core" }
nullslop-tui = { path = "crates/common/nullslop-tui" }
nullslop-component-ui = { path = "crates/common/nullslop-component-ui" }
nullslop-component = { path = "crates/common/nullslop-component" }
nullslop-cli = { path = "crates/common/nullslop-cli" }
nullslop-services = { path = "crates/common/nullslop-services" }
nsslice-echo = { path = "crates/slices/nsslice-echo" }
nsslice-shutdown = { path = "crates/slices/nsslice-shutdown" }
nsslice-shutdown-protocol = { path = "crates/slices/nsslice-shutdown-protocol" }
nsslice-llm = { path = "crates/slices/nsslice-llm" }
nullslop-actor = { path = "crates/common/nullslop-actor" }
nullslop-actor-host = { path = "crates/common/nullslop-actor-host" }
nullslop-providers = { path = "crates/common/nullslop-providers" }
nullslop-protocol-derive = { path = "crates/common/nullslop-protocol-derive" }
nullslop-selection-widget = { path = "crates/common/nullslop-selection-widget" }
nullslop-workflow = { path = "crates/common/nullslop-workflow" }
nsslice-tools = { path = "crates/slices/nsslice-tools" }
nullslop-intent = { path = "crates/common/nullslop-intent" }
nsslice-status-bar = { path = "crates/slices/nsslice-status-bar" }
nsslice-char-counter = { path = "crates/slices/nsslice-char-counter" }
nsslice-dashboard = { path = "crates/slices/nsslice-dashboard" }
nsslice-dashboard-protocol = { path = "crates/slices/nsslice-dashboard-protocol" }
nsslice-pinned-panel-protocol = { path = "crates/slices/nsslice-pinned-panel-protocol" }
nsslice-chat-input-box-protocol = { path = "crates/slices/nsslice-chat-input-box-protocol" }
nsslice-chat-log = { path = "crates/slices/nsslice-chat-log" }
nsslice-provider = { path = "crates/slices/nsslice-provider" }
nsslice-provider-protocol = { path = "crates/slices/nsslice-provider-protocol" }
nsslice-pinned-panel = { path = "crates/slices/nsslice-pinned-panel" }
nsslice-chat-input-box = { path = "crates/slices/nsslice-chat-input-box" }
nsslice-picker = { path = "crates/slices/nsslice-picker" }
nsslice-chat-entry-selection = { path = "crates/slices/nsslice-chat-entry-selection" }
nsslice-navigation = { path = "crates/slices/nsslice-navigation" }
nsslice-session-management = { path = "crates/slices/nsslice-session-management" }
nsslice-session-management-protocol = { path = "crates/slices/nsslice-session-management-protocol" }
nsslice-global = { path = "crates/slices/nsslice-global" }
nsslice-chat-session-protocol = { path = "crates/slices/nsslice-chat-session-protocol" }

# Error handling
wherror = "2.3.1"
error-stack = { version = "0.7", features = ["serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async / channels
tokio = { version = "1", features = ["full"] }
kanal = "0.1"
futures = "0.3"

# UI
ratatui = "0.30.0"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-which-key = "0.11.0"
ratatui-tabs = "0.2.0"
ratatui-spatial-splits = "0.2.0"
throbber-widgets-tui = "0.11"

# State
parking_lot = "0.12"

# Time
jiff = { version = "0.2", features = ["serde"] }
humantime = "2"

# DX
derive_more = { version = "2", features = ["debug", "display"] }
rstest = "0.26"
tempfile = "3"

# CLI
clap = { version = "4", features = ["derive"] }
clap-verbosity-flag = "3"

# LLM
llm = { path = "vendor/llm", default-features = false, features = [
    "default-tls",
    "openrouter",
    "openai",
    "anthropic",
    "ollama",
    "deepseek",
    "xai",
    "phind",
    "google",
    "groq",
    "cohere",
    "mistral",
    "huggingface",
    "elevenlabs",
] }

# Other
dirs = "6"
toml = "0.8"
dotenvy = "0.15"
unicode-segmentation = "1"
fuzzy-matcher = "0.3"
async-trait = "0.1"
dialoguer = "0.12"
arboard = "3"
sha2 = "0.10"
glob = "0.3"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Proc-macro
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# UUID
uuid = { version = "1.23.1", features = ["v4", "serde"] }

# Testing (e2e)
cucumber = "0.23"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
wildcard_imports = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
implicit_hasher = "allow"
single_match = "allow"
min_ident_chars = "allow"
rest_pat_in_fully_bound_structs = "allow"

allow_attributes = "warn"
allow_attributes_without_reason = "deny"
as_underscore = "deny"
clone_on_ref_ptr = "allow"
create_dir = "deny"
dbg_macro = "warn"
else_if_without_else = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "deny"
empty_structs_with_brackets = "deny"
error_impl_error = "deny"
exit = "deny"
expect_used = "warn"
field_scoped_visibility_modifiers = "warn"
filetype_is_file = "warn"
float_cmp_const = "deny"
get_unwrap = "deny"
if_then_some_else_none = "warn"
impl_trait_in_params = "deny"
integer_division = "warn"
large_include_file = "deny"
let_underscore_must_use = "allow"
lossy_float_literal = "deny"
map_err_ignore = "deny"
map_with_unused_argument_over_ranges = "warn"
missing_assert_message = "warn"
missing_docs_in_private_items = "warn"
mixed_read_write_in_expression = "warn"
multiple_unsafe_ops_per_block = "deny"
mutex_atomic = "deny"
mutex_integer = "deny"
needless_raw_strings = "warn"
non_zero_suggestions = "deny"
panic = "warn"
panic_in_result_fn = "deny"
partial_pub_fields = "deny"
pathbuf_init_then_push = "warn"
print_stderr = "warn"
print_stdout = "warn"
pub_with_shorthand = "allow"
rc_buffer = "warn"
rc_mutex = "deny"
redundant_test_prefix = "deny"
redundant_type_annotations = "deny"
renamed_function_params = "warn"
return_and_then = "warn"
same_name_method = "warn"
str_to_string = "warn"
string_add = "warn"
string_slice = "deny"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
unneeded_field_pattern = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unused_trait_names = "allow"
unwrap_in_result = "deny"
use_debug = "warn"
verbose_file_reads = "warn"

indexing_slicing = "deny"

