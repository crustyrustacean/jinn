[package]
name = "jinn-common"
version.workspace = true
edition.workspace = true

[dependencies]
toml = { workspace = true }
toml_edit = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
dirs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
tokio = { workspace = true }

[features]
default = []
# Exposes test-only helpers (e.g. `AppPaths::set_home_dir_for_test`) so that downstream
# crates can use them from their own test suites. `#[cfg(test)]` does not propagate
# across crate boundaries, so this feature is the boundary instead.
testing = []

[dev-dependencies]
tempfile = { workspace = true }
rstest = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Toolhelp32-based process-tree termination, the Windows counterpart to
# Unix's process-group kill. Only the default `blocking` feature is needed:
# kill-on-drop runs synchronously from a `Drop` impl (no async runtime).
kill_tree = "0.2"

[lints]
workspace = true
