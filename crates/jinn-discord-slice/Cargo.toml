[package]
name = "jinn-discord-slice"
version = "0.116.1"
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait = { workspace = true }
daow = { workspace = true }
jinn-core-types = { workspace = true }
jinn-dashboard = { workspace = true }
jinn-discord-msg = { workspace = true }
# The bridge actor relays kernel bus events (session lifecycle family) into
# the gateway channel; the session slices have not graduated to crates yet,
# so their event types still live in jinn-domain. This edge dies when they do.
jinn-domain = { workspace = true, features = ["test-harness"] }
jinn-slices = { workspace = true }
kanal = { workspace = true }
kameo = { workspace = true }
kameo_actors = { workspace = true }
parking_lot = { workspace = true }
rstest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
trouper = { workspace = true }
tracing = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }

[build-dependencies]
rusqlite = { workspace = true }
jinn-session-schema = { workspace = true }

[dev-dependencies]
jinn-testutil = { workspace = true }
