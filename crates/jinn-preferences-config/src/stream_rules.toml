# stream_rules.toml — jinn's shipped command guards.
#
# This file is the embedded default set of `[[stream_rules.entry]]` rules.
# jinn reads it at launch; a `stream_rules.toml` sitting beside your
# `jinn.toml` (written once by `jinn install`, or by `jinn config init`)
# REPLACES this set wholesale, and any `[[stream_rules.entry]]` rules in
# `jinn.toml` are appended after it. An existing-but-empty user file
# therefore disarms every shipped guard — that is the intended off
# switch. A user file that fails to parse is warned about and ignored in
# favour of this embedded set, so a typo never leaves you unguarded.
#
# What a rule does, by example:
#
# > A rule pairs regex `conditions` with a `body` of corrective guidance.
# > When a condition matches a `tool:bash` call's arguments as they stream,
# > the turn is interrupted before the command runs and resumed with `body`
# > as guidance — the model is told and tries again. There is one behaviour;
# > there is no on_trigger key and no ask/confirm tier. A rule fires at most
# > once per session turn, and the stream-rule watchdog bounds how many
# > interrupts a session may take in a row.
# >
# > Fields:
# >
# >   name        unique rule id; shows up in the interrupt and in logs
# >   description one line, human-facing: what habit the rule catches
# >   conditions  one or more regexes; ANY match fires the rule
# >   scopes      where the rule looks: `text`, `thinking`, `tool`, or
# >               `tool:<name>(<glob>)`. Every rule in this file uses
# >               `tool:bash`. `project` would confine a rule to matching a
# >               session's project association (stamped at creation); none of
# >               these need it.
# >   body        the guidance the model resumes under. Say what is wrong
# >               and give the working alternative.
# >   positive    test fixtures: bare command strings that MUST trip this
# >               rule. jinn ignores them at runtime (unknown keys to the
# >               live schema); the test harness drives every one through
# >               the production matcher.
# >   negative    test fixtures: commands that must NOT trip it. Caught
# >               false positives fail CI.
# >
# > Example:
# >
# > [[stream_rules.entry]]
# > name = 'no-recursive-flag-rewrite'
# > description = 'a combined ripgrep flag rewrites matches instead of listing them'
# > conditions = ['rg -rn']
# > scopes = ['tool:bash']
# > body = 'ripgrep is already recursive and `-r` takes a replacement value, so combining it with `-n` rewrites every match instead of listing it, and still exits 0 -- use `-n` alone for line numbers.'
# > positive = ['rg -rn pattern src/']
# > negative = ['rg -n pattern src/', 'rg pattern src/']
#
# Regex constraints:
#
# > Use single-quoted strings so regex metacharacters survive without escape
# > processing. A pattern the engine cannot compile is inert (logged, no
# > interrupt). The engine has no lookaround: `(?<!...)` and `(?=...)` do
# > not work. The matcher sees the tool call's serialized arguments, so a
# > bash command arrives inside a JSON envelope: {"command":"..."}. A
# > command start is anchored on the envelope head, not `^`; an argument
# > that can end the command ends at the envelope's closing quote, not `$`.
#
# Curation stance: the agent running these tools is assumed innocent —
# the guards exist for the command an agent emits by ACCIDENT while doing
# ordinary work, where running it once destroys data, leaks private
# material, or hangs the machine. Deliberate-but-destructive operations a
# competent agent runs legitimately on a normal week (git reset --hard,
# git branch -D, chmod -R, docker system prune, make, plain `rm -rf` of a
# named build directory) are deliberately absent; interrupting them weekly
# would make jinn useless out of the box. Where a research pattern's
# unavoidable over-match hit that weekly-legitimate class, it was dropped
# or reshaped, and the entry's comment says so.
#
# Attribution: each entry carries `source` and `license` comments naming
# where the pattern came from. Sources: dylancaponi/claude-code-permissions
# (no upstream license file — short patterns shipped with credit by
# decision), openai/codex (Apache-2.0), SWE-agent/SWE-agent (MIT), and the
# unattributable command-line folklore canon.

# ###########################################################################
# Whole-filesystem search habits (jinn's original shipped guards)
# ###########################################################################

# source: jinn shipped defaults (default_jinn.toml, before this file)
# license: AGPL-3.0 (this project)
# Ripgrep is recursive already; `-r` takes a replacement value and the
# combined form silently rewrites every match to a letter -- and exits 0.
[[stream_rules.entry]]
name = 'no-recursive-flag-rewrite'
description = 'a combined ripgrep flag rewrites matches instead of listing them'
conditions = ['rg -rn']
scopes = ['tool:bash']
body = 'ripgrep is already recursive and `-r` takes a replacement value, so combining it with `-n` rewrites every match instead of listing it, and still exits 0 -- use `-n` alone for line numbers.'
positive = ['rg -rn pattern src/']
negative = ['rg -n pattern src/', 'rg pattern src/']

# source: jinn shipped defaults (default_jinn.toml, before this file);
#   boundary extended past the shipped `(\s|$)` so the bare form also trips
#   inside the tool-call JSON envelope, where the command ends at a quote.
# license: AGPL-3.0 (this project)
# Anchors on the command word and its search path, ending at whitespace,
# end-of-buffer, or the envelope quote so a *bounded* path is never
# caught. The regex is searched anywhere in the buffer, so a leading
# `cd <dir> &&` chain is caught too.
[[stream_rules.entry]]
name = 'no-bare-find-root'
description = 'a bare find at the filesystem root walks everything'
conditions = ['\bfind\s+/(?:\s|")']
scopes = ['tool:bash']
body = 'A bare find at the filesystem root walks the entire disk -- it will hang for minutes and bury the answer in noise. Search a bounded root instead: find under the project directory with `-name`, or use `rg --files -g <glob>` which is recursive by default and much faster. If you truly need a system-wide search, scope it with `-maxdepth` and prune noise.'
positive = ['find /', 'find / -name x', 'find / -maxdepth 2 -type d']
negative = ['find src/ -name x', 'find /etc/nginx -name conf', 'rg --files /docs']

# source: jinn shipped defaults (default_jinn.toml, before this file);
#   boundary extended as in no-bare-find-root.
# license: AGPL-3.0 (this project)
[[stream_rules.entry]]
name = 'no-bare-find-home'
description = 'a bare find at the home root walks everything'
conditions = ['\bfind\s+~(?:\s|")']
scopes = ['tool:bash']
body = 'A bare find at the home root walks your entire home directory, including caches, build trees, and dotfile folders. Search a bounded path instead: find under the project directory with `-name`, or use `rg --files -g <glob>`. If you truly need a home-wide search, scope it with `-maxdepth` and prune build directories.'
positive = ['find ~', "find ~ -name '*.log'", 'find ~ -maxdepth 1 -type d']
negative = ['find ~/.cache -name x', 'find ./src -name x']

# source: jinn shipped defaults (default_jinn.toml, before this file);
#   terminal boundary extended with the envelope quote as above.
# license: AGPL-3.0 (this project)
# Guards the recursive flag: a short cluster containing an uppercase `R`
# (or the long `--recursive`). Lowercase `-r` is `--reverse` and
# deliberately not matched, which is why the pattern carries no `(?i)`.
# The path is a bare root reference (optionally quoted, with an optional
# glob or trailing slash) followed by a boundary that is never a path
# character. The boundary is a real byte -- whitespace, a shell delimiter,
# or the envelope's closing quote -- never the end of the accumulated
# buffer: the matcher holds a match riding the buffer's edge while the
# stream is open, so an end-anchored terminal here would fire on every
# intermediate buffer (`ls -R /` matching before `/etc/nginx` arrives).
# Double-quoted TOML string: the quoted path forms contain a single quote,
# which a literal string cannot hold.
[[stream_rules.entry]]
name = 'no-recursive-listing-root'
description = 'a recursive listing of the filesystem root dumps everything'
conditions = ["\\bls\\b\\s*(?:[^\\s;&|/~$'\\\"][^\\s;&|]*\\s+)*(-\\w*R\\w*|--recursive)\\s+(?:[^\\s;&|/~$'\\\"][^\\s;&|]*\\s+)*(?:/|'\\/'|\\\"/\\\")(?:\\*+|/+)?(?:\\s|;|&|\\||\\)|\\]|\\}|<|>|\\\")"]
scopes = ['tool:bash']
body = 'Listing a bare root directory recursively dumps the whole tree into the transcript -- thousands of irrelevant lines and a slow tool call. Scope it to the directory you actually care about (`-I target` to skip build output), or search with `rg --files -g <glob>` / `fd`.'
positive = ['ls -R /', 'ls -R / | head -5', 'ls -lR / | wc -l']
negative = ['ls -R target/', 'ls src/', 'ls -R /etc/nginx']

# source: jinn shipped defaults (default_jinn.toml, before this file);
#   terminal boundary extended with the envelope quote as above (and, as in
#   no-recursive-listing-root, no end-of-buffer terminal: the matcher holds
#   edge-riding matches mid-stream, so `$` would fire on every prefix).
# license: AGPL-3.0 (this project)
[[stream_rules.entry]]
name = 'no-recursive-listing-home'
description = 'a recursive listing of the home root dumps everything'
conditions = ["\\bls\\b\\s*(?:[^\\s;&|/~$'\\\"][^\\s;&|]*\\s+)*(-\\w*R\\w*|--recursive)\\s+(?:[^\\s;&|/~$'\\\"][^\\s;&|]*\\s+)*(?:~|\\$HOME|\\\"\\$HOME\\\"|'~'|'\\$HOME'|\\$\\{HOME\\}|\\\"\\$\\{HOME\\}\\\")(?:\\*+|/+)*(?:\\s|;|&|\\||\\)|\\]|\\}|<|>|\\\")"]
scopes = ['tool:bash']
body = 'Listing a bare home directory recursively dumps your whole tree -- caches, build outputs, and dotfile folders. Scope it to the directory you actually care about (`-I target` to skip build output), or search with `rg --files -g <glob>` / `fd`.'
positive = ['ls -R ~', 'ls -R ~ | head -5', 'ls -R $HOME | wc -l']
negative = ['ls -R ~/code', 'ls -R target/']

# ###########################################################################
# Destructive filesystem
# ###########################################################################

# source: reshaped from dylancaponi/claude-code-permissions (rm -[rR]) and
#   openai/codex is_dangerous_command.rs (ForcedRm) for the JSON envelope.
# license: unlicensed (no license file upstream; shipped with per-entry
#   credit) / Apache-2.0 (codex)
# The upstream ask-severity rule fires on ANY recursive rm; that class
# includes the weekly-legitimate build-directory clean, so it is reshaped
# here to the accidentally-lethal targets only: a bare root or home, a
# variable operand (the Steam incident: rm -rf "$STEAMROOT/"*), or a glob
# operand (the Bumblebee one-token class). A named directory is never
# caught. Condition 1 is the root/home form -- its boundary is a real byte
# (whitespace, a shell delimiter, or the envelope's closing quote), never
# the end of the accumulated buffer, which the matcher holds unproven while
# the stream is open; condition 2's `\$` is an escaped literal dollar sign
# matching a `$VAR` operand, not an anchor; condition 3 is the glob form.
[[stream_rules.entry]]
name = 'no-unbounded-recursive-rm'
description = 'a recursive rm aimed at a root, home, variable, or glob deletes far more than intended'
conditions = [
    '(?i)\brm\s[^;&|]*?-\w*[rR]\w*[^;&|]*?\s+\\?"?[/~](?:\*|/+)*\\?"?(?:\s|;|&|\||\})',
    '(?i)\brm\s[^;&|]*?-\w*[rR]\w*[^;&|]*?\s+\\?"?\$',
    '(?i)\brm\s[^;&|]*?-\w*[rR]\w*[^;&|]*?\s+[^;&|]*\*',
]
scopes = ['tool:bash']
body = 'This recursive rm names a root, home, variable, or glob, so an unset variable or a stray character deletes far more than intended. Name the exact directory you want gone (no glob, no variable, no bare / or ~), check it with ls first, and rm that one path.'
positive = ['rm -rf /', 'rm -rf ~', 'rm -rf $SOMEVAR', 'rm -rf "$SOMEVAR"', 'rm -rf target/*', 'rm -r -f /', 'sudo rm -rf /']
negative = ['rm -rf /tmp/build', 'rm -r node_modules', 'rm build.log', 'rm -f package.lock', 'rm -i /tmp/x', 'rm -rf ~/code/old-build']

# source: reshaped from dylancaponi/claude-code-permissions (redirect to a
#   root path outside tmp/dev/null) for the regex crate (no lookaround).
# license: unlicensed (no license file upstream; shipped with per-entry
#   credit)
# Condition 1 is the raw device / proc-sysrq write (lethal regardless of
# what upstream's approximation did). Condition 2 is any other root path,
# with the safe first letters excluded by class: d (dev), h (home), p
# (private, proc, and pixel buffers), t (tmp), v (var).
[[stream_rules.entry]]
name = 'no-redirect-to-root-path'
description = 'a redirect into a root-owned path or raw device overwrites system state'
conditions = [
    '(?i)>\s*/(?:dev/(?:sd|nvme|hd|loop|mapper)|proc/sysrq)',
    '(?i)>\s*/[a-cefgiloqrsuw-z]',
]
scopes = ['tool:bash']
body = 'That redirect writes into a root-owned path or a raw device. Redirect inside the project or /tmp instead; if you truly need to change a system file, say so and let the user run it.'
positive = ['echo x > /etc/hosts', 'date > /dev/sda', 'echo 1 > /proc/sysrq-trigger', 'echo x > /usr/share/x', 'echo x > /opt/app.cfg']
negative = ['echo x > /dev/null', 'echo x > /tmp/out', 'echo x > out.txt', 'ls > listing.txt', 'echo x > /var/log/app.log', 'echo x > /home/me/out.txt']

# source: dylancaponi/claude-code-permissions hooks/check-bash-command.sh
#   (mkfs), reshaped: the device is located anywhere after the command, so
#   `mkfs -t ext4 <dev>` is caught too and man-page reads stay silent.
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-mkfs'
description = 'mkfs formats a device, destroying everything on it'
conditions = ['(?i)\bmkfs[^;&|]*/dev/']
scopes = ['tool:bash']
body = 'mkfs formats a device and destroys everything on it. There is no ordinary work that needs this; stop and let the user handle block devices.'
positive = ['mkfs.ext4 /dev/sdb1', 'mkfs -t ext4 /dev/sdb1', 'mkfs /dev/sda']
negative = ['man mkfs.ext4', 'ls /dev/sdb1']

# source: dylancaponi/claude-code-permissions hooks/check-bash-command.sh (dd)
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-dd-device-write'
description = 'dd with an if= operand writes raw data over a target, devices included'
conditions = ['(?i)\bdd\s+if=']
scopes = ['tool:bash']
body = 'dd copies raw blocks and silently overruns its target -- pointed at a device it destroys it. There is no ordinary work that needs dd; stop and let the user run it.'
positive = ['dd if=backup.img of=/dev/sda', 'dd if=/dev/zero of=disk.bin bs=1M']
negative = ['dd --help', 'ls dd']

# source: dylancaponi/claude-code-permissions hooks/check-bash-command.sh (shred)
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-shred'
description = 'shred overwrites a file in place, making it unrecoverable'
conditions = ['(?i)\bshred\s']
scopes = ['tool:bash']
body = 'shred overwrites a file until it is unrecoverable. If a file must be deleted, rm it; shred is for deliberate secure erasure and should be the user call.'
positive = ['shred -u secrets.txt']
negative = ['man shred', 'ls shred']

# source: dylancaponi/claude-code-permissions hooks/check-bash-command.sh
#   (truncate), narrowed to the coreutils flag so SQL TRUNCATE TABLE and
#   man-page reads stay silent.
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-truncate'
description = 'truncate empties a file in place with no confirmation'
conditions = ['(?i)\btruncate\s+-s']
scopes = ['tool:bash']
body = 'truncate empties the named file in place with no confirmation and no recovery. Empty a log by rotating it, or delete the file outright if it is disposable.'
positive = ['truncate -s 0 /var/log/app.log', 'truncate -s 0 build.log']
negative = ['man truncate', "psql -c 'SELECT 1'", 'touch /var/log/app.log']

# source: dylancaponi/claude-code-permissions hooks/check-bash-command.sh
#   (wipefs), reshaped: the device is located anywhere after the command so
#   man-page reads stay silent.
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-wipefs'
description = 'wipefs erases filesystem signatures from a device'
conditions = ['(?i)\bwipefs[^;&|]*/dev/']
scopes = ['tool:bash']
body = 'wipefs erases filesystem signatures from a device, leaving its data unmountable. There is no ordinary work that needs this; stop and let the user handle block devices.'
positive = ['wipefs /dev/sdb', 'wipefs -a /dev/sdb']
negative = ['man wipefs', 'ls /dev/sdb']

# source: dylancaponi/claude-code-permissions hooks/check-bash-command.sh
#   (diskutil erase, macOS)
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-diskutil-erase'
description = 'diskutil erase formats a macOS volume'
conditions = ['(?i)\bdiskutil\s+erase']
scopes = ['tool:bash']
body = 'diskutil erase formats a volume and destroys everything on it. There is no ordinary work that needs this; stop and let the user run it.'
positive = ['diskutil eraseDisk JHFS+ Disk1 disk1', 'diskutil eraseVolume JHFS+ Untitled disk1s2']
negative = ['diskutil list', 'diskutil info disk1']

# source: dylancaponi/claude-code-permissions hooks/check-bash-command.sh
#   (fdisk), reshaped: only the directly-targeted form fires, so the
#   read-only `fdisk -l` probe agents legitimately run stays silent.
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-fdisk'
description = 'fdisk invoked on a device opens the interactive partition editor'
conditions = ['(?i)\bfdisk\s+"?/dev/']
scopes = ['tool:bash']
body = 'That fdisk invocation opens the interactive partition editor on a device -- it blocks this call and rewrites the partition table if it ever runs. Use `fdisk -l` to inspect, and let the user partition.'
positive = ['fdisk /dev/sda', 'fdisk "/dev/sda"']
negative = ['fdisk -l /dev/sda', 'man fdisk']

# ###########################################################################
# Destructive git
# ###########################################################################

# source: dylancaponi/claude-code-permissions (git push --force), reshaped so
#   the safer --force-with-lease spelling stays silent.
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-force-push'
description = 'git push --force overwrites published history'
conditions = ['(?i)\bgit\s+push\b.*--force(?:\s|")']
scopes = ['tool:bash']
body = 'Force-pushing overwrites the remote branch history and destroys any commit others based work on. Push normally, open a PR, and let the user decide about rewriting published history.'
positive = ['git push --force origin main', 'git push origin main --force', 'git push --force']
negative = ['git push --force-with-lease origin feature', 'git push origin feature']

# source: dylancaponi/claude-code-permissions (git push -f)
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-force-push-short'
description = 'git push -f overwrites published history'
conditions = ['(?i)\bgit\s+push\b.*\s-f\b']
scopes = ['tool:bash']
body = 'Force-pushing overwrites the remote branch history and destroys any commit others based work on. Push normally, open a PR, and let the user decide about rewriting published history.'
positive = ['git push -f origin main', 'git push origin main -f']
negative = ['git push origin feature', 'git fetch -f origin', 'git push --force-with-lease origin feature']

# source: dylancaponi/claude-code-permissions (git clean -f)
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-git-clean-force'
description = 'git clean -f permanently deletes untracked files'
conditions = ['(?i)\bgit\s+clean\s+-[a-z]*f']
scopes = ['tool:bash']
body = 'git clean -f permanently deletes untracked files, including anything never committed. Run `git clean -n` first and show the user what would go, or delete named paths you just created yourself.'
positive = ['git clean -fd', 'git clean -f', 'git clean -dfx']
negative = ['git clean -n', 'git clean -nd']

# source: dylancaponi/claude-code-permissions (git reflog expire)
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-git-reflog-expire'
description = 'git reflog expire destroys the recovery path for lost commits'
conditions = ['(?i)\bgit\s+reflog\s+expire']
scopes = ['tool:bash']
body = 'Expiring the reflog destroys the only recovery path for dangling commits. Leave the reflog alone; if disk use is the concern, say so and let the user decide.'
positive = ['git reflog expire --expire=now --all']
negative = ['git reflog']

# source: dylancaponi/claude-code-permissions (git gc --prune)
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-git-gc-prune'
description = 'git gc --prune permanently drops unreachable objects'
conditions = ['(?i)\bgit\s+gc\s+--prune']
scopes = ['tool:bash']
body = 'Pruning makes every unreachable commit permanently unrecoverable. Plain `git gc` is fine; leave --prune to the user.'
positive = ['git gc --prune=now']
negative = ['git gc', 'git status']

# source: dylancaponi/claude-code-permissions (filter-branch, filter-repo),
#   merged into one rule; anchored on `git` so grepping code or docs for
#   the tool names stays silent.
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-git-history-rewrite'
description = 'git filter-branch/filter-repo rewrites every commit in history'
conditions = ['(?i)\bgit\s+filter-branch\b', '(?i)\bgit\s+filter-repo\b']
scopes = ['tool:bash']
body = 'History rewriting invalidates every clone and is unrecoverable once the old objects prune. It is a user decision, not a cleanup step -- explain what you wanted and stop.'
positive = ['git filter-branch --env-filter x HEAD', 'git filter-repo --path secret.txt --invert-paths']
negative = ['git log', 'rg filter-repo docs/', 'git branch --list filter-repo-me']

# source: dylancaponi/claude-code-permissions (git stash drop/clear)
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-git-stash-drop'
description = 'git stash drop/clear throws away stashed work with no recovery'
conditions = ['(?i)\bgit\s+stash\s+(drop|clear)']
scopes = ['tool:bash']
body = 'Dropping stashes throws away stashed work permanently. Pop the specific stash if its contents are wanted, or leave it for the user.'
positive = ['git stash drop', 'git stash clear', 'git stash drop stash@{0}']
negative = ['git stash list', 'git stash pop']

# ###########################################################################
# Publishing and remote resources
# ###########################################################################

# source: dylancaponi/claude-code-permissions (gh repo delete)
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-gh-repo-delete'
description = 'gh repo delete permanently removes a GitHub repository'
conditions = ['(?i)\bgh\s+repo\s+delete']
scopes = ['tool:bash']
body = 'Deleting a repository is permanent and takes issues, PRs, and releases with it. Never delete a repo as part of ordinary work -- stop and let the user do it.'
positive = ['gh repo delete owner/repo', 'gh repo delete owner/repo --yes']
negative = ['gh repo view owner/repo', 'gh pr list']

# source: dylancaponi/claude-code-permissions (npm publish), narrowed to the
#   bare form: `npm publish --dry-run` is the safe rehearsal the guidance
#   itself asks for, so it stays silent.
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-npm-publish'
description = 'a bare npm publish makes the package public immediately and is hard to undo'
conditions = ['(?i)\bnpm\s+publish\s*(?:;|")']
scopes = ['tool:bash']
body = 'Publishing makes the package public immediately and is effectively irreversible. Rehearse with `npm publish --dry-run` and let the user do the real publish.'
positive = ['npm publish', 'npm publish;']
negative = ['npm publish --dry-run', 'npm pack', 'npm run build', 'npm install']

# source: dylancaponi/claude-code-permissions (npm unpublish)
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-npm-unpublish'
description = 'npm unpublish removes a published package version'
conditions = ['(?i)\bnpm\s+unpublish']
scopes = ['tool:bash']
body = 'Unpublishing breaks every downstream install of that version and the name may be blocked from re-publishing. Stop and let the user decide.'
positive = ['npm unpublish pkg@1.0.0']
negative = ['npm view pkg version', 'npm install pkg']

# ###########################################################################
# Cloud and infrastructure
# ###########################################################################

# source: dylancaponi/claude-code-permissions (gcloud delete)
# license: unlicensed (no license file upstream; shipped with per-entry credit)
[[stream_rules.entry]]
name = 'no-gcloud-delete'
description = 'a gcloud delete destroys cloud resources'
conditions = ['(?i)\bgcloud\s+.*\bdelete\b']
scopes = ['tool:bash']
body = 'A gcloud delete destroys a cloud resource, and against the wrong project it is unrecoverable. Confirm the target with a describe/list first and let the user run deletes against anything shared.'
positive = ['gcloud sql instances delete prod-db', 'gcloud compute instances delete old-vm']
negative = ['gcloud sql instances list', 'gcloud config get-value project']

