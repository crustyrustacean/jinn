[package]
name = "jinn-web-fetch"
version.workspace = true
edition.workspace = true

[dependencies]
async-trait = { workspace = true }
tracing = { workspace = true }
wherror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
reqwest = { workspace = true }
url = "2"
htmd = "0.5"
parking_lot = { workspace = true }
tokio = { workspace = true, optional = true }
headless_chrome = { version = "1.0", optional = true }
# anyhow is a boundary dependency used to downcast headless_chrome's error type
# (ConnectionClosed) for type-safe connection-death detection. It is NOT used for
# jinn's own error handling — the project uses wherror/error_stack for that.
anyhow = { version = "1", optional = true }

[dev-dependencies]
rstest = { workspace = true }
serde_json = { workspace = true }
mockito = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true

[features]
default = ["headless-chrome"]
headless-chrome = ["dep:headless_chrome", "dep:tokio", "dep:anyhow"]
