<!--
  Hand-constructed DDG anti-bot challenge fixture.

  When DDG detects unusual traffic it returns an HTTP 202 page containing a
  challenge form and phrases like "anomaly" / "If this error persists".
  The searcher must detect this and return SearchError::Blocked.
-->
<!DOCTYPE html>
<html lang="en">
<head><title>DuckDuckGo</title></head>
<body>
  <iframe name="ifr" width="0" height="0" border="0" class="hidden"></iframe>
  <form id="challenge-form" action="//duckduckgo.com/anomaly.js" method="POST"></form>
  <noscript>
    <p>If this error persists, please let us know.</p>
  </noscript>
</body>
</html>
