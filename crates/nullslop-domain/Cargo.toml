[package]
name = "nullslop-domain"
version = "0.1.0"
edition = "2024"

[features]
default = []
which-key = ["ratatui-which-key"]

[dependencies]
# Internal deps
llm = { workspace = true }
nullslop-plugin = { path = "../nullslop-plugin" }
nullslop-selection-widget = { workspace = true }
nullslop-protocol-derive = { workspace = true }
rhai = { version = "1", features = ["sync"] }

# External deps
serde = { workspace = true }
serde_json = { workspace = true }
jiff = { workspace = true }
derive_more = { workspace = true }
ratatui-which-key = { workspace = true, optional = true }
uuid = { workspace = true }
ratatui = { workspace = true }
async-trait = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
unicode-segmentation = { workspace = true }
tiktoken = { workspace = true }
textwrap = { workspace = true }
throbber-widgets-tui = { workspace = true }
humantime = { workspace = true }
fuzzy-matcher = { workspace = true }
parking_lot = { workspace = true }
kanal = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
toml = { workspace = true }
reasoning-parser = "1.2"

[dev-dependencies]
rstest = { workspace = true }
nullslop-testutil = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
result_large_err = "allow"
field_scoped_visibility_modifiers = "allow"
module_inception = "allow"
must_use_candidate = "allow"
missing_docs_in_private_items = "allow"
doc_markdown = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
return_self_not_must_use = "allow"
single_match = "allow"
struct_excessive_bools = "allow"
