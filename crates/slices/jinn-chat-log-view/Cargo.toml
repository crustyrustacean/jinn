[package]
name = "jinn-chat-log-view"
version.workspace = true
edition.workspace = true

[features]
# Opt-in: compiles the full 36-grammar tree-sitter set for markdown code-block
# highlighting instead of the curated default set (see root Cargo.toml).
syntax-all = ["ratatui-markdown/highlight-lang-all"]

[dependencies]
jinn-chat-log-view-msg = { workspace = true }
# The chat log's UiElement adapter reads AppState through the kernel's
# RenderCtx and publishes layout results onto the bus. The kernel depends
# on this crate for nothing but the -msg edge, so this direction is acyclic.
jinn-domain = { workspace = true }
jinn-slices = { workspace = true }
jinn-core-types = { workspace = true }
jinn-skills-msg = { workspace = true }
jinn-theme = { workspace = true }
jinn-provider = { workspace = true }
jinn-tools-msg = { workspace = true }
ratatui = { workspace = true }
ratatui-markdown = { workspace = true }
jiff = { workspace = true }
serde_json = { workspace = true }
strip-ansi-escapes = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
throbber-widgets-tui = { workspace = true }
jinn-session-msg = { workspace = true }
jinn-session-history-msg = { workspace = true }
jinn-session-state = { workspace = true }
jinn-session-store-msg = { workspace = true }
jinn-turn-dispatch-msg = { workspace = true }
jinn-inference-msg = { workspace = true }
jinn-preferences-config = { workspace = true }
jinn-config = { workspace = true }
trouper = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
error-stack = { workspace = true }
wherror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
rstest = { workspace = true }
tokio = { workspace = true }
jinn-preferences-config = { workspace = true }
jinn-config = { workspace = true }
jinn-testutil = { workspace = true }
jinn-sidebar-msg = { workspace = true }

[lints]
workspace = true
