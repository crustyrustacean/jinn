[package]
name = "jinn-model-market"
version.workspace = true
edition.workspace = true
description = "The OpenRouter model-market popup: cost projection under adjustable mix presets, Epoch ECI quality join, per-endpoint detail, all fetched through actors with explicit TTL caches."

[dependencies]
error-stack = { workspace = true }
wherror = { workspace = true }
jinn-common = { workspace = true }
jinn-core-types = { workspace = true }
jinn-kernel = { workspace = true }
jinn-model-market-msg = { workspace = true }
jinn-picker = { workspace = true }
jinn-preferences-config = { workspace = true }
jinn-provider = { workspace = true }
jinn-provider-config = { workspace = true }
jinn-provider-selection-msg = { workspace = true }
jinn-selection-widget = { workspace = true }
jinn-slices = { workspace = true }
jinn-theme = { workspace = true }
csv = { workspace = true }
fuzzy-matcher = { workspace = true }
jiff = { workspace = true }
ratatui = { workspace = true }
# Pinned to jinn-provider's reqwest (0.12): `list_endpoints` takes that
# version's `Client`, and the workspace default is 0.13.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
trouper = { workspace = true }
unicode-segmentation = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
jinn-testutil = { workspace = true }
mockito = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
