[package]
name = "jinn-persona"
version.workspace = true
edition.workspace = true
description = "The persona slice: parses persona markdown into the personas cell at activation."

[dependencies]
jinn-persona-msg = { workspace = true }
jinn-slices = { workspace = true }
jinn-picker = { workspace = true }
jinn-selection-widget = { workspace = true }
jinn-theme = { workspace = true }
jinn-app-state = { workspace = true }
jinn-preferences-config = { workspace = true }
jinn-session-msg = { workspace = true }
ratatui = { workspace = true }
toml = { workspace = true, features = ["parse"] }
serde = { workspace = true, features = ["derive"] }
tracing = { workspace = true }
wherror = { workspace = true }
error-stack = { workspace = true }

[dev-dependencies]
# The picker tests wire the slice the way composition does, which needs the
# kernel's Services. Production code reaches the state through jinn-app-state
# and never touches the kernel, which is what keeps this slice kernel-free.
jinn-kernel = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
