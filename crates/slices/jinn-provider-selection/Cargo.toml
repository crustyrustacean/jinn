[package]
name = "jinn-provider-selection"
version.workspace = true
edition.workspace = true
description = "The provider-selection slice: the provider actor (switch, refresh, picker loads, endpoint fetch), the discover actor, and the provider cell."

[dependencies]
jinn-provider-selection-msg = { workspace = true }
# The trouper runtime: ServiceActors, topics, schemas.
trouper = { workspace = true }
# Kernel dep (turn-dispatch/watchdog precedent): the provider actor
# writes AppState through named `State` projections for session model
# changes and picker render state, loads entries
# through the kernel picker registry's spec hooks, and reads services
# (registry, api keys, paths). The kernel
# re-exports the slice's contracts so the long-standing jinn_kernel::X
# paths keep resolving.
jinn-kernel = { workspace = true }
jinn-slices = { workspace = true }
jinn-provider = { workspace = true }
jinn-provider-config = { workspace = true }
jinn-core-types = { workspace = true }
jinn-theme = { workspace = true }
jinn-selection-widget = { workspace = true }
jinn-picker = { workspace = true }
# The reasoning picker's confirm writes the session's effort and seeds the
# global default through these two crossing contracts.
jinn-preferences-config = { workspace = true }
jinn-session-msg = { workspace = true }
jiff = { workspace = true }
ratatui = { workspace = true }
unicode-segmentation = { workspace = true }
humantime = { workspace = true }
serde = { workspace = true }
error-stack = { workspace = true }
wherror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Activation resolves the provider cells from the shared catalog, so the
# tests seed their registry through it rather than through the slice.
jinn-cell-catalog = { workspace = true }
jinn-testutil = { workspace = true }

serde_json = { workspace = true }
rstest = { workspace = true }
jinn-kernel = { workspace = true }
jinn-session-state = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

