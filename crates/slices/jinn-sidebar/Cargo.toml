[package]
name = "jinn-sidebar"
version.workspace = true
edition.workspace = true

[dependencies]
jinn-mcp-msg = { workspace = true }
jinn-attendant = { workspace = true }
jinn-attendant-msg = { workspace = true }
jinn-chat-log-view = { workspace = true }
jinn-chat-log-view-msg = { workspace = true }
jinn-chat-input-msg = { workspace = true }
jinn-persona-msg = { workspace = true }
# Opens the persona picker when the sidebar's persona section is active.
jinn-persona = { workspace = true }
jinn-sidebar-msg = { workspace = true }
jinn-slices = { workspace = true }
jinn-session-history-msg = { workspace = true }
jinn-session-list = { workspace = true }
jinn-session-lifecycle-msg = { workspace = true }
jinn-session-state = { workspace = true }
jinn-session-msg = { workspace = true }
jinn-session-store-msg = { workspace = true }
# The model cache the shared status line reads the context limit from.
jinn-provider-config = { workspace = true }
jinn-term = { workspace = true }
jinn-term-msg = { workspace = true }
jinn-theme = { workspace = true }
# The trouper runtime: ServiceActors, topics, schemas.
trouper = { workspace = true }
# Slice → kernel edge (established by jinn-dashboard): the sidebar's
# trouper actor folds kernel session events into state through the
# kernel's shared `State` handle, and the route actions reuse kernel
# feature helpers. The kernel never depends back on this crate.
jinn-core-types = { workspace = true }
jinn-skills = { workspace = true }
# The session preview popup's footer renders the shared status line
# the status bar under the chat input draws.
jinn-status-bar = { workspace = true }
jinn-kernel = { workspace = true }
jinn-preferences-config = { workspace = true }
jinn-tools = { workspace = true }
tracing = { workspace = true }
jinn-tools-msg = { workspace = true }
jinn-picker = { workspace = true }
error-stack = { workspace = true }
serde_json = { workspace = true }
wherror = { workspace = true }
parking_lot = { workspace = true }
ratatui = { workspace = true }
textwrap = { workspace = true }
throbber-widgets-tui = { workspace = true }
unicode-segmentation = { workspace = true }
jiff = { workspace = true }
unicode-width = { workspace = true }
rstest = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
# The preview tests build typed cwd fixtures and format paths for assertions.
marked-path = { workspace = true }
jinn-config = { workspace = true }
jinn-kernel = { workspace = true }
jinn-testutil = { workspace = true }
# The preview tests assert the ~-shortened cwd form and seed token records.
dirs = { workspace = true }
jinn-token-count-msg = { workspace = true }
# The preview tests derive their cwd fixtures from a tempdir, so no absolute
# path literal ships in test code.
tokio = { workspace = true, features = ["macros", "rt", "time"] }
