# jinn default configuration

# ###########################################################################
# Tools
# ###########################################################################
[tools]
# > Default execution timeout (seconds) for all builtin tool calls. Acts as a
# > safety ceiling so a hung tool never stalls the turn indefinitely. Bash calls
# > can override this per-call via the `max_duration_secs` tool argument.
default_timeout_secs = 300

# > Number of lines in a tool call before truncating.
max_output_lines = 2000

# > Number of bytes in a tool call before truncating.
max_output_bytes = 51200

# > Disable these tools
disabled = ["grep"]

# ---------------------------------------------------------------------------
# Command policies
# ---------------------------------------------------------------------------
#
# > A `command_policy` that applies to every session, in every directory. Same
# > shape as a project's `command_policy`: each rule pairs a regex `pattern`
# > (matched against the full command string) with the corrective `message`
# > returned to the agent when it matches. The command never runs.
#
# > These rules are evaluated *before* the matching project's rules and the
# > first match wins, so a project policy can only add blocks — it cannot lift a
# > global one. Use this for mistakes that are never correct anywhere; keep
# > repo-specific habits in the project's own `command_policy`.
#
# > Use single-quoted strings so regex metacharacters survive without escape
# > processing. A pattern the regex engine cannot compile is inert (logged, no
# > block) and the engine has no lookaround, so `(?<!...)` and `(?=...)` will
# > not work.
#
# > The rule below guards a real footgun: ripgrep is recursive already, so `-r`
# > takes a replacement value and `rg -rn` silently rewrites every match to
# > `n` — and exits 0.
[[tools.bash_command_policy]]
pattern = 'rg -rn'
message = 'ripgrep is already recursive and `-r` takes a replacement value, so `rg -rn` rewrites every match to `n` and still exits 0 — use `-n` alone for line numbers.'

# > The next four rules block whole-filesystem search habits. An agent that
# > cannot find something reaches for `find /` or `ls -R /` and walks the
# > entire machine, hanging for minutes and returning thousands of
# > irrelevant hits.
# >
# > Each pattern anchors on the command word and its search path, ending at a
# > space or end-of-command so a *bounded* path is never caught:
# > `find /mnt/zed/...` and `ls -R ~/code/myapp` do not match, but
# > `find / more crap here` does. Because the regex is searched anywhere in
# > the command string, a leading `cd <dir> &&` chain is caught too — only
# > the argument shape is constrained, not the whole line.
[[tools.bash_command_policy]]
pattern = '\bfind\s+/(\s|$)'
message = 'A bare `find /` walks the entire filesystem — it will hang for minutes and bury the answer in noise. Search a bounded root instead: `find <project-dir> -name <pattern>`, or `rg --files -g <glob>` which is recursive by default and much faster. If you truly need a system-wide search, scope it with `-maxdepth` and prune noise (`-path /proc -prune -o -path /sys -prune -o ...`).'

[[tools.bash_command_policy]]
pattern = '\bfind\s+~(\s|$)'
message = 'A bare `find ~` walks your entire home directory, including caches, build trees, and dotfile folders. Search a bounded path instead: `find ~/code/myapp -name <pattern>`, or `rg --files -g <glob>`. If you truly need a home-wide search, scope it with `-maxdepth` and prune build directories.'

# > The `ls` rules guard the recursive flag. The flag is matched as a short
# > cluster containing an uppercase `R` (`-R`, and combined forms like `-lR`,
# > `-1R`, `-Rt`) or as the long `--recursive`. Lowercase `-r` is
# > `--reverse` — it only flips sort order within one directory and dumps
# > nothing — so it is deliberately not matched, and the uppercase `R` is why
# > the pattern carries no `(?i)`.
# >
# > Anything may sit between `ls` and the flag, and between the flag and the
# > path: other flags, `--color=always`, quoted values. The argument run that
# > absorbs them cannot start with the characters a bare path starts with
# > (`/ ~ $ ' "`) and cannot cross a `;`, `&`, or `|`, which is what keeps
# > `ls -R /usr` and `ls -R ~/code` (both bounded) from matching while
# > stopping `ls -R ~/code && cd /` from letting the run reach into the next
# > command.
# >
# > The path is then a bare `/` or home reference (`~`, `$HOME`, `${HOME}`,
# > optionally quoted, with an optional glob or trailing slash), followed by a
# > boundary that is whitespace, a separator, a redirect, a closing paren, or
# > end of command — never a path character. That boundary is what stops
# > `ls -R /usr` from matching on its `ls -R /` prefix, while still catching
# > `ls -R / 2>/dev/null | head` and `(ls -R /)`.
# >
# > These two patterns are double-quoted rather than single-quoted: the quoted
# > path forms contain a `'`, which a literal TOML string cannot hold.
# > Everywhere else in this file, prefer single quotes.
[[tools.bash_command_policy]]
pattern = "\\bls\\b\\s*(?:[^\\s;&|/~$'\\\"][^\\s;&|]*\\s+)*(-\\w*R\\w*|--recursive)\\s+(?:[^\\s;&|/~$'\\\"][^\\s;&|]*\\s+)*(?:/|'\\/'|\\\"/\\\")(?:\\*+|/+)?(?:\\s|;|&|\\||\\)|\\]|\\}|<|>|$)"
message = 'Listing a bare `/` or `~` recursively dumps the whole filesystem or home tree into the transcript — thousands of irrelevant lines and a slow tool call. Scope it to the directory you actually care about (`ls -R <project-dir> -I target`), or search with `rg --files -g <glob>` / `fd`.'

[[tools.bash_command_policy]]
pattern = "\\bls\\b\\s*(?:[^\\s;&|/~$'\\\"][^\\s;&|]*\\s+)*(-\\w*R\\w*|--recursive)\\s+(?:[^\\s;&|/~$'\\\"][^\\s;&|]*\\s+)*(?:~|\\$HOME|\\\"\\$HOME\\\"|'~'|'\\$HOME'|\\$\\{HOME\\}|\\\"\\$\\{HOME\\}\\\")(?:\\*+|/+)*(?:\\s|;|&|\\||\\)|\\]|\\}|<|>|$)"
message = 'Listing a bare `~` recursively dumps your whole home directory — caches, build trees, and dotfile folders. Scope it to the directory you actually care about (`ls -R <dir> -I target`), or search with `rg --files -g <glob>` / `fd`.'

# ###########################################################################
# Chat log
# ###########################################################################
[chat_log]
#
# > Number of lines displayed in a tool result. This is just the visual
# > representation in the chat log and does not impact what is sent to the model.
tool_entry_max_lines = 6
#
# > Once this many consecutive out-of-context chat entries is reached, they will
# > be collapsed into a hidden block.
min_collapse_count = 3
#
# ###########################################################################
# Skills
# ###########################################################################
[skills]
#
# > Disable these skills
disabled = ["phased-task-loop"]

# ###########################################################################
# Session lifecycle commands
# ###########################################################################
# > Lifecycle commands run at session startup and teardown. They allow you to
# > setup and cleanup the environment.
#
# > `setup_command` is ran when the session is created. `teardown_command` is ran
# > when the session is "closed" or the command can be ran manually with the `t`
# > keyboard shortcut.
#
# > The `setup_command` can optionally end by printing the desired CWD and jinn
# > will configure the session to use that CWD. This is useful when checking out
# > a new branch in a new workspace and then switching to that workspace.
#

# > my_project/        <-- configured as the project directory in jinn
# >    repo.fossil
# >    checkouts_will_go_here_as_siblings/
# >       .fslckout
# >
[[session_lifecycle.script]]
name = "fossil branch checkout"
description = "Open a new checkout + branch"
setup_command = "mkdir <branch> && cd <branch> && fossil open ../<repo>.fossil && fossil commit -m 'Open <branch>' --branch <branch> --allow-empty && echo ./<branch>"
teardown_command = "fossil merge trunk --force && fossil addremove && fossil commit -m 'Bring in latest trunk' && fossil update trunk && fossil merge <branch> && fossil addremove && fossil commit -m 'Merge <branch>' && fossil branch close <branch> && cd .. && rm -rfv <branch>"

# >Git worktrees. Project directory should be a parent folder of the repo:
#
# >my_project/        <-- configured as the project directory in jinn
# >   repo/           <-- your actual repo
# >      .git/
# >   worktrees_will_go_here_as_siblings/
# >      .git/
# >
[[session_lifecycle.script]]
name = "git worktree"
description = "Open a git worktree + branch"
setup_command = "cd <repo> && git worktree add -b <branch> ../<branch> && cd .. && echo $(pwd)/<branch>"
teardown_command = """bash -c 'git add -A && (git diff --cached --quiet || git commit -q -m "auto-commit at teardown") && git merge main && cd ../<repo> && git merge --squash <branch> && (git diff --cached --quiet || git commit -q -m "Merge <branch>") && git worktree remove ../<branch> && git branch -D <branch>'"""

# ###########################################################################
# Projects
# ###########################################################################
#
# > Projects are curated directories you frequently start sessions in. They
# > appear in the project picker (`<leader>sp`) and let you create a session
# > directly at one of these paths without first changing the active session's
# > directory.
#
# > Add one block per directory. Duplicates are ignored.
#
# > A project may also carry a `command_policy`: a list of blocked-command
# > rules enforced by the bash tool for any session whose working directory
# > falls inside the project. Each rule pairs a regex `pattern` (matched
# > against the full command string; first match wins) with the corrective
# > `message` returned to the agent when it matches. The command never runs.
#
# [[project.entry]]
# path = "~/code/jinn"
# command_policy = [{ pattern = 'cargo\s+(test|t)\b.*\s-p\b', message = "cargo test -p triggers a clean rebuild in this repo — run `just test` for the whole workspace instead." }]

# ###########################################################################
# MCP servers (Model Context Protocol)
# ###########################################################################
# > jinn acts as an MCP *client*: each entry below declares a server it can
# > connect to. Servers are OFF by default and must be enabled per-session
# > (the choice is persisted with the session). When enabled for a session,
# > jinn spawns/connects the server, advertises its tools to the model under
# > a namespaced id `mcp__<name>__<tool>`, and forwards calls to it.
#
# > Add one block per server. The `name` must be unique across all servers.
#
# > Three transport modes are available:
#
# >   stdio       (default) — jinn spawns the server and talks over its
# >                          stdin/stdout. Most MCP servers support this.
# >                          Omit the `transport` field entirely.
#
# >   local_http  — jinn spawns the server (usually with a --port flag) and
# >                connects over HTTP. jinn allocates a free port for each
# >                session and expands the `<port>` token in both `args` and
# >                `url` with that port. The host is parsed from the `url`.
# >                Use this when the server supports HTTP mode and you want
# >                stdout logging or HTTP transport.
#
# >   remote_http — jinn connects to an already-running server at the
# >                given `url`. No process is spawned; `command`/`args` are
# >                not needed. Use this for servers running in Docker, on a
# >                remote host, or as a system service.
#
# > stdio example (transport omitted — it's the default)
# [mcp.foo]
# command = "npx"
# args = ["@foo/mcp-server", "--stdio"]
# auto_enable = false
#
# > local_http example
# [mcp.foo_http]
# command = "npx"
# > - <port> is expanded to a jinn-allocated port number
# > - <ip> is expanded to the IP address listed in the `url` key (below).
# args = ["@foo/mcp-server", "--port", "<port>", "--host", "<ip>"]
# transport = "local_http"
# url = "http://127.0.0.1:<port>/mcp"
#
# > remote_http example (no process spawned, connect to url)
# [mcp.foo_remote]
# transport = "remote_http"
# url = "http://localhost:3001/mcp"
#
# > HTTP headers (local_http and remote_http only; ignored on stdio).
# > Values may embed ${ENV_VAR} tokens — expanded from your environment once
# > at startup. Changing a variable requires a jinn restart to take effect.
# > A variable that is unset or empty keeps the server from connecting and
# > names the variable in the failure; header values are never logged.
#
# [mcp.foo_remote.headers]
# Authorization = "Bearer ${MY_API_KEY}"
# X-Api-Key = "${OTHER_KEY}"

# > Compaction command + auto compaction.
[context_curation.compaction]
# > Provider/model used for compaction summarization. Falls back to the session model
# > when unset.
# model = "openrouter/deepseek/deepseek-v4.1-flash"
#
# > Automatically compact the conversation when the used context window exceeds
# > this usage percentage. Recommend no higher than 0.85 to account for drift in
# > token calculations between models and providers (jinn applies a single token
# > calculation across the board).
threshold = 0.7

# > Number of tokens to reserve during compaction. This will keep up to the
# > `reserve_tokens` worth of recent messages so the model doesn't lose track of
# > what it was working on.
reserve_tokens = 20000

# > Fallback context window size (in tokens) when the provider does not report one.
# > Note that if the provider doesn't report the size that you can configure it
# > manually in `providers.toml` (highly recommended)
fallback_context_window = 150000

# > Policy for retrying failed provider requests.
[provider.request_retry]
# > Retry the request this amount of times before aborting.
max_retries = 5

# > Retry uses exponential backoff. Start at this number of seconds, doubling each retry.
base_delay_secs = 2

# > Maximum amount of time to wait before retrying.
max_delay_secs = 60

# > OpenRouter web search. Only valid when using OpenRouter as the provider.
[provider.web_search]
# > Search engine used by the openrouter_web_search tool. One of:
# > - "exa",
# > - "firecrawl"
# > - "parallel"
# > - "native"
# > - "auto"
engine = "exa"

# > Optional OpenRouter web-search tuning.

# > Maximum number of results to return per individual tool call.
# max_results = 5

# > Maximum number of results to return per request.
# max_total_results = 20

# > Controls how much context is used by the OpenRouter results processing
# > engine when handling the results (ie: extra big pages would need more
# > context). Leave unset to let OpenRouter decide.
# > "low", "medium", "high" are only acceptable values.
# search_context_size = "medium"

# > If present, only ever searches these domains.
# allowed_domains = ["example.com", "docs.example.com"]

# > If present, blocks these domains from the search result.
# excluded_domains = ["pinterest.com"]

[ui.cwd_selector]
# > Shell command template run by the cwd_selector tool. `{path}` is replaced
# > with the starting directory. Must print a single absolute path on stdout.
command = "find -L {path} -type d 2>/dev/null | fzf --no-multi"

# > The minimap uses colors (dark to light) to mark the size of a particular
# > message.
[ui.minimap]
# > Messages `max_tokens` or higher will always be the lightest color.
max_tokens = 2000

# ###########################################################################
# Watchdogs
# ###########################################################################

# > Monitors for streams that fail to provide tokens.
[watchdog.stall]
# > Seconds of stream silence before a stalled turn is retried. Minimum 1.
timeout_secs = 60
# > Consecutive silent-stall restarts allowed before the turn is cancelled.
max_restarts = 3

# > Monitors tool call problems.
[watchdog.tool_call]
# > Tool failures before the turn is cancelled. The calculation uses a simple
# > accumulator that increments on fail and decrements on success. So the
# > failures may or may not be consecutive.
max_failures = 4

# ###########################################################################
# Interactive terminal panes
# ###########################################################################

[term]
# > Keybind to toggle keyboard capture.
control_toggle_key = "<c-g>"

# > When an agent sends a keystroke, the terminal must remain unchanged for
# > this long before a terminal screenshot is sent back to the agent.
settle_quiet_ms = 400

# > After an agent sends a keystroke, the maximum amount of time to wait until
# > sending a terminal screenshot back to the agent. This covers cases with stuff
# > like `htop` that may update more frequently than the settle_quiet_ms.
settle_max_wait_ms = 3000

[attendant]

[[attendant.entry]]
behavior = "preserve"
disabled_skills = ["phased-task-loop"]
disabled_tools = ["grep"]
model = { single = "openrouter/deepseek/deepseek-v4.1-flash" }
name = "sample"
pins = [{ role = "user", text = "hello" }, { role = "user", text = "sup" }]
prep_mode = false
reasoning_effort = "high"
seed_template = "The previous run of this attendant reported: <prior report>."
trigger = "manual"

[[attendant.entry]]
behavior = "reset"
disabled_skills = ["phased-task-loop"]
disabled_tools = ["grep"]
model = { single = "openrouter/deepseek/deepseek-v4.1-flash" }
name = "lol"
pins = [{ role = "user", text = "wait" }]
prep_mode = true
reasoning_effort = "high"
seed_template = "The previous run of this attendant reported: <prior report>."
trigger = "manual"

[context_curation.auto_prune]
# > When auto pruners run, their targeted chat entries are held in a queue
# > until the sum of the queued chat entries reaches this token threshold. This
# > queueing is to keep cache hits high in order to take advantage of cache
# > pricing.
accumulation_threshold_tokens = 150000

# ---------------------------------------------------------------------------
# > Prunes `edit` and `write` tool results that precede a `read` of the same file.
#
#   X  edit(/foo.rs)        ← pruned
#   X  edit applied         ← pruned
#      read(/foo.rs)        ← trigger
#      <contents>
[context_curation.auto_prune.edit_read]
enabled = true
# > Only apply pruning after there are this many messages ahead of the prune target.
min_age = 100

# ---------------------------------------------------------------------------
# > Prunes `read` tool results that precede an `edit` or `write` of the same file.
#
#     read(/foo.rs)        ← pruned
#     <contents>
#     edit(/foo.rs)
#     write(/foo.rs)       ← 2nd edit: trigger, threshold = 2
[context_curation.auto_prune.read_edit]
enabled = true
# > Number of edits or writes before the "read" becomes stale.
threshold = 2
# > Only apply pruning after there are this many messages ahead of the prune target.
min_age = 80

# ---------------------------------------------------------------------------
# > Prunes context based on regex rules.
[context_curation.auto_prune.regex]
enabled = true

# > In this example, only 2 `cargo test` are allowed to remain in context. Once
# > a third `cargo test` is detected, then the oldest detected result will be
# > pruned.
[[context_curation.auto_prune.regex.rules]]
# > Regex pattern to check
pattern = "cargo test"
# > Tool name to check
tool_name = "bash"
# > Keep this many matching instances.
keep_last = 2
# > Only apply pruning after there are this many messages ahead of the prune target.
min_age = 100

[[context_curation.auto_prune.regex.rules]]
pattern = "cargo check"
tool_name = "bash"
keep_last = 1
min_age = 100

[[context_curation.auto_prune.regex.rules]]
pattern = "cargo clippy"
tool_name = "bash"
keep_last = 1
min_age = 50

# ---------------------------------------------------------------------------
# > Prunes the `edit` tool if it failed.
[context_curation.auto_prune.broken_edit]
enabled = true
# > Only apply pruning after there are this many messages ahead of the prune target.
min_age = 30


# ---------------------------------------------------------------------------
# > Prunes todo list calls.
#
# > With the default settings (min_age=0, protect_latest=true), the latest todo
# > call will remain in history indefinitely and older todo entries will get
# > pruned.
[context_curation.auto_prune.todo]
enabled = true
# > Setting to 0 means it can trigger immediately.
min_age = 0
# > Force-include the most recent todo call+result pair so other pruners can
# > never remove the current task list from context.
protect_latest = true

# ---------------------------------------------------------------------------
# > Prunes files that have been edited/written multiple times.
[context_curation.auto_prune.double_edit]
enabled = true
# > The number of writes/edits to keep for any particular file
max_file_edits = 2
# > Only apply pruning after there are this many messages ahead of the prune target.
min_age = 40

# ---------------------------------------------------------------------------
# > Prunes reads of the same file.
[context_curation.auto_prune.consecutive_reads]
enabled = true
# > Keep up to 5 reads per file. Don't set this too low because agents can read
# > files in chunks multiple times on purpose.
keep_last = 5
# > Only apply pruning after there are this many messages ahead of the prune target.
min_age = 120

# ---------------------------------------------------------------------------
# > Catch-all pruner that removes all tool results of a certain age.
[context_curation.auto_prune.tool_age_window]
enabled = true
# > Only apply pruning after there are this many messages ahead of the prune
# > target. Since this pruner impacts all tool calls, make sure min_age is set
# > relatively high.
min_age = 200

# ---------------------------------------------------------------------------
# > Prunes short assistant entries. These are common during tool loops when then
# > model is "thinking out loud" or "restating" what it's doing.
[context_curation.auto_prune.trivial_assistant]
enabled = true
# > Prune entries of this token length or smaller.
max_tokens = 80
# > Only apply pruning after there are this many messages ahead of the prune
# > target. The min_age for this pruner should be set somewhat high because
# > models use their own short responses to stay on track.
min_age = 100

# ---------------------------------------------------------------------------
# > Prunes large assistant entries.
#
# > Sometimes the assistant thinks "out loud" with large entries (which we want
# > to prune). However, large entries are also typically associated with direct
# > responses to user messages and are of more importance (like plans or
# > explanations or code samples that we want to keep).
#
# > This pruner calculates a `radius` of entries anchored from all user messages
# > and the first/last message in the entire chat history. If the assistant entry
# > is outside the radius, it gets pruned. If it's inside, it stays. The size of
# > the assistant message is the `trivial_assistant` pruner config `max_tokens`
# > size + 1.
#
# > Here's a visual to help explain:
#
#  u = user message
#  A = assistant message
#  t = tool call
#  . = outside radius
#  - = inside radius
#
#         keep                            keep
#         v     v                         v  v
#        uAtttttA.........................AttAttu
# anchor ^-------|         prune         |------^ user message anchor

[context_curation.auto_prune.anchored_assistant]
enabled = true
# > Protect large assistant messages if a user messages is within the radius
# > (in terms of entries), or this many entries near a session edge.
radius = 20
# > Only apply pruning after there are this many messages ahead of the prune target.
min_age = 50

# ###########################################################################
# Discord integration
# ###########################################################################
#
# [discord]
# > Whether the Discord bot is active.
# enabled = true
#
# > Discord secret bot token.
# > *** SECURITY NOTE ***
# > You can omit this and set DISCORD_BOT_TOKEN env variable to avoid putting
# > it in your config.
# > *********************
# bot_token = "<token>"
#
# > Discord guild (server) ID the bot operates in.
# guild_id = "<id>"
#
# > Forum channel where the bot creates session threads.
# forum_channel = "<channel id>"
#
# > Users that may access the bot
# authorized_users = ["<user id>"]
