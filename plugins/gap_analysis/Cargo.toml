[package]
name = "gap_analysis"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jinn-guest-pdk = { path = "../../crates/jinn-guest-pdk" }
wit-bindgen = "0.51"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }

[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
