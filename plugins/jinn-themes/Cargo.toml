[package]
name = "jinn-plugin-themes"
version = "0.1.0"
edition = "2024"
description = "First-party jinn plugin: discovers and contributes TOML themes."
license = "MIT"
publish = false

[dependencies]
jinn-plugin-api = { path = "../../crates/jinn-plugin-api" }
jinn-plugin-sdk = { path = "../../crates/jinn-plugin-sdk" }
jinn-theme = { path = "../../crates/jinn-theme", default-features = false }
serde_json = "1"
error-stack = { workspace = true }

# Plugins are guest payloads, not core code — they run outside the
# strict workspace lint profile on purpose (expect/unwrap are fine in a
# short-lived guest; stdout/stderr ARE the wire).
[lints.clippy]
print_stdout = "allow"
print_stderr = "allow"
expect_used = "allow"
unwrap_used = "allow"
panic = "allow"
