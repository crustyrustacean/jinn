[package]
name = "persona-loader"
version = "0.1.0"
edition = "2024"
description = "First-party jinn plugin: discovers and contributes markdown personas."
license = "MIT"
publish = false

# Plugin payload manifest: build embeds this into the artifact and install
# applies it. Grants use `<config_dir>`/`<data_dir>` variables; `:w` marks
# a grant writable.
[package.metadata.jinn]
grants = ["<config_dir>/personas"]
http = false

[dependencies]
jinn-plugin-api = { path = "../../crates/jinn-plugin-api" }
jinn-plugin-sdk = { path = "../../crates/jinn-plugin-sdk" }
serde = { workspace = true }
serde_json = "1"
error-stack = { workspace = true }
wherror = { workspace = true }
toml = { workspace = true }

# Plugins are guest payloads, not core code — they run outside the
# strict workspace lint profile on purpose (expect/unwrap are fine in a
# short-lived guest; stdout/stderr ARE the wire).
[lints.clippy]
print_stdout = "allow"
print_stderr = "allow"
expect_used = "allow"
unwrap_used = "allow"
panic = "allow"

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }
