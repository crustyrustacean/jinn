[package]
name = "tool-call-watchdog"
version.workspace = true
edition = "2024"
description = "First-party jinn plugin: cancels a session's stream when tool failures spiral (per-session saturating accumulator)."
license = "MIT"
publish = false

# Plugin payload manifest: build embeds this into the artifact and install
# applies it. The watchdog only observes forwarded events and pushes
# mirrored session commands — no filesystem or network access.
[package.metadata.jinn]
grants = []
http = false

[dependencies]
jinn-plugin-api = { path = "../../crates/jinn-plugin-api" }
jinn-plugin-sdk = { path = "../../crates/jinn-plugin-sdk" }
serde_json = "1"

[dev-dependencies]
rstest = { workspace = true }

# Plugins are guest payloads, not core code — they run outside the
# strict workspace lint profile on purpose (expect/unwrap are fine in a
# guest; stdout/stderr ARE the wire).
[lints.clippy]
print_stdout = "allow"
print_stderr = "allow"
expect_used = "allow"
unwrap_used = "allow"
panic = "allow"
