[package]
name = "url-citations"
version.workspace = true
edition = "2024"
description = "First-party jinn plugin: shape-based URL citation detection from tool call/result events."
license = "MIT"
publish = false

# Plugin payload manifest: build embeds this into the artifact and install
# applies it. This plugin is stateless — no filesystem or network access.
[package.metadata.jinn]
grants = []
http = false

[dependencies]
jinn-plugin-api = { path = "../../crates/jinn-plugin-api" }
jinn-plugin-sdk = { path = "../../crates/jinn-plugin-sdk" }
serde_json = "1"
form_urlencoded = "1"

# Plugins are guest payloads, not core code — they run outside the
# strict workspace lint profile on purpose (expect/unwrap are fine in a
# guest; stdout/stderr ARE the wire).
[lints.clippy]
print_stdout = "allow"
print_stderr = "allow"
expect_used = "allow"
unwrap_used = "allow"
panic = "allow"
