# Catppuccin Mocha — warm pastel dark theme for jinn
# Place in ~/.config/jinn/themes/catppuccin-mocha.toml

# Borders & focus
focus_accent = "#cba6f7"       # Mauve
border_unfocused = "#45475a"   # Surface1
popup_title = "#a6e3a1"        # Green (matches picker_active_marker)

# Text
primary_text = "#cdd6f4"       # Text
muted_text = "#6c7086"         # Overlay0
error_text = "#f38ba8"         # Red

# Status
success = "#a6e3a1"            # Green
warning = "#f9e2af"            # Yellow
streaming = "#89dceb"          # Sky

# Chat log backgrounds
gutter_bg = [30, 30, 46]       # Base
gutter_context_included = [40, 110, 120]  # muted teal — matches cool palette tones
user_block_bg = [49, 50, 68]   # Surface0
tool_fg = [147, 153, 178] # Overlay2
tool_success_bg = [36, 50, 36]
tool_failure_bg = [50, 30, 38]
compaction_block_bg = [55, 45, 72]   # muted mauve blend
truncation_fg = [69, 71, 90]   # Surface1

# Picker
picker_active_marker = "#a6e3a1"   # Green
picker_selected_bg = "#313244"     # Surface0
picker_highlight_bg = "#45475a"    # Surface1

# Tab bar
tab_active_fg = "#1e1e2e"      # Base (dark text on mauve)
tab_active_bg = "#cba6f7"      # Mauve
tab_inactive_fg = "#7f849c"    # Overlay1

# Selection highlight fallback
selection_fg = "#cdd6f4"       # Text
selection_bg = [79, 80, 98]       # Surface0

# Provider picker
accent_action = "#fab387"      # Peach
age_fresh = "#a6e3a1"          # Green
age_stale = "#f38ba8"          # Red

# Scroll indicator
scroll_indicator_bg = [17, 17, 27] # Crust


# Input mode badge (queue vs steer)
input_mode_queue = "#6c7086"
input_mode_steer = "#cba6f7"
