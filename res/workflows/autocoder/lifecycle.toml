# Session lifecycle scripts for autocoder runs.
#
# Loaded by path: the workflow's prompts call the `run_lifecycle` tool with
# `path` pointed at this file and `script` naming the entry to run. Nothing
# here belongs in a user `jinn.toml`.
#
# Portability contract:
#
#   - POSIX sh only (jinn runs lifecycle commands with `$SHELL -c`).
#   - Every script probes its checkout — fossil first, then git — and
#     refuses when neither is present. No repository file, path, branch,
#     or VCS name is baked in anywhere.
#   - Values render through the lifecycle tool's shell-quoting renderer;
#     named `<placeholder>` arguments only, so an argument cannot
#     restructure a command.
#
# Layout: worktrees are SIBLINGS of the checkout that spawned them, never
# nested inside one. The workflow derives sibling paths from `verify`'s
# `root:` line. Commit mechanics never depend on layout — every checkout
# is a window onto the one shared repository — but the sibling rule keeps
# trash placement stable and ignore rules unnecessary.
#
# Deletion policy — protected removal, two halves:
#
#   1. `trash-stage` MOVES a verified worktree into a `.jinn-autocoder-trash/`
#      beside it. Gates: the target may not be the caller's checkout, its
#      ancestor, or its descendant; it must be a checkout root itself; and
#      its repository identity must match the caller's. The worst case that
#      passes every gate is a move, not a deletion — recoverable by hand.
#   2. `trash-purge` carries no placeholders, so it renders verbatim and
#      cannot be aimed. The workflow calls it only at the next run's start —
#      a human action closes the cooling-off window.

# ── Verify the session's position ────────────────────────────────
# The run-entry probe. No placeholders; safe to call with empty args.
# Exits nonzero unless the caller sits in an open checkout. Prints three
# lines the orchestrator records in its ledger: `branch:` (the checked-out
# branch), `repo-id:` (the repository identity trash-stage checks), and
# `root:` (the checkout's absolute path — the base for deriving sibling
# worktree dirs).
[[session_lifecycle.script]]
name = "verify"
description = "Confirm this session is inside an open checkout; print its branch, repository id, and checkout root"
setup_command = """
if [ -f .fslckout ]; then
  B="$(fossil branch current 2>/dev/null)"
  WID="$(fossil info 2>/dev/null | sed -n 's/^project-code: *//p')"
  ROOT="$(fossil info 2>/dev/null | sed -n 's/^local-root: *//p')"
elif [ -e .git ]; then
  B="$(git symbolic-ref --short HEAD 2>/dev/null || git rev-parse HEAD 2>/dev/null)"
  WID="$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)"
  ROOT="$(git rev-parse --path-format=absolute --show-toplevel 2>/dev/null)"
else
  echo "not inside a supported VCS checkout" >&2; exit 1
fi
if [ -z "$B" ] || [ -z "$WID" ] || [ -z "$ROOT" ]; then
  echo "could not read branch, repository id, and checkout root" >&2; exit 1
fi
echo "branch: $B"
echo "repo-id: $WID"
echo "root: ${ROOT%/}"
"""
teardown_command = "true"

# ── Fork and open ────────────────────────────────────────────────
# New branch <branch> forked from <from>, opened as a worktree at <dir>.
# <dir> is the dispatch's choice — the workflow always passes an absolute
# sibling path. Prints the worktree path as the last line; the lifecycle
# actor adopts it as the session's CWD. Refuses a path that is already an
# open checkout.
[[session_lifecycle.script]]
name = "worktree-new"
description = "Fork a branch off a source branch and open it as a worktree"
setup_command = """
if [ -f .fslckout ]; then
  REPO="$(fossil info 2>/dev/null | sed -n 's/^repository: *//p')"
  if [ -z "$REPO" ]; then echo "not inside an open fossil checkout" >&2; exit 1; fi
  if [ -e <dir>/.fslckout ]; then echo "<dir> is already an open checkout" >&2; exit 1; fi
  mkdir -p <dir> \
    && fossil branch new <branch> <from> && cd <dir> \
    && fossil open --nested "$REPO" <branch> && echo "$PWD"
elif [ -e .git ]; then
  git worktree add -b <branch> <dir> <from> \
    && cd <dir> && echo "$PWD"
else
  echo "not inside a supported VCS checkout" >&2; exit 1
fi"""
teardown_command = "true"

# ── Open an existing branch ──────────────────────────────────────
# Open an existing branch <branch> in a new worktree at <dir>. Used when a
# branch exists but no session holds it: reattaching after a stage died, or
# the run-end base-branch merge. On git, a branch already checked out in
# another worktree opens detached at its tip — enough to merge from.
[[session_lifecycle.script]]
name = "worktree-open"
description = "Open an existing branch as a worktree"
setup_command = """
if [ -f .fslckout ]; then
  REPO="$(fossil info 2>/dev/null | sed -n 's/^repository: *//p')"
  if [ -z "$REPO" ]; then echo "not inside an open fossil checkout" >&2; exit 1; fi
  if [ -e <dir>/.fslckout ]; then echo "<dir> is already an open checkout" >&2; exit 1; fi
  mkdir -p <dir> && cd <dir> \
    && fossil open --nested "$REPO" <branch> && echo "$PWD"
elif [ -e .git ]; then
  git worktree add <dir> <branch> 2>/dev/null \
    || git worktree add --detach <dir> <branch> \
    && cd <dir> && echo "$PWD"
else
  echo "not inside a supported VCS checkout" >&2; exit 1
fi"""
teardown_command = "true"

# ── Merge into the current checkout ──────────────────────────────
# One primitive for every merge in the run: a stage syncs the run branch
# into its own checkout, the orchestrator merges a passed stage branch
# into the run branch, and the base-branch merge brings the run branch
# into the temporary base checkout. Always merges INTO WHERE THE CALLER
# SITS; who may merge what is workflow policy, not script mechanics.
[[session_lifecycle.script]]
name = "merge"
description = "Merge a branch into the current checkout"
setup_command = """
if [ -f .fslckout ]; then
  fossil merge <branch>
elif [ -e .git ]; then
  git merge <branch>
else
  echo "not inside a supported VCS checkout" >&2; exit 1
fi"""
teardown_command = "true"

# ── Advance the base branch ──────────────────────────────────────
# The run's single base-branch write. Two steps, both values rendered
# shell-quoted into a shell VARIABLE. First, from your checkout, open
# the land worktree: <branch>-land is a NEW branch at the base tip (the
# base itself may be checked out elsewhere — a new branch next to it is
# fine). After the land checkout merges the run branch and commits, run
# this from YOUR checkout: fast-forward <branch> to the land branch's
# commit, refusing a non-fast-forward. The main checkout's worktree
# updates cleanly; nothing is detached, nothing forced.
[[session_lifecycle.script]]
name = "worktree-land"
description = "Open a land worktree: a new branch at the base branch's tip"
setup_command = """
DIR=<dir>
if [ -e .git ]; then
  git worktree add -b <branch>-land "$DIR" <branch> && cd "$DIR" && echo "$PWD"
else
  echo "worktree-land is git-only; fossil lands by opening the base branch directly" >&2; exit 1
fi"""
teardown_command = "true"

[[session_lifecycle.script]]
name = "advance"
description = "Fast-forward the base branch to the land branch's commit"
setup_command = """
BR=<branch>
if [ -f .fslckout ]; then
  B="$(fossil branch current 2>/dev/null)"
  if [ "$B" != "$BR" ]; then echo "current checkout is on '$B', not $BR" >&2; exit 1; fi
  echo "base branch $BR carries the run (fossil commits advance it directly)"
elif [ -e .git ]; then
  git merge --ff-only "$BR-land" \
    || { echo "base branch $BR cannot fast-forward to $BR-land" >&2; exit 1; }
  echo "base branch $BR advanced to the land commit"
else
  echo "not inside a supported VCS checkout" >&2; exit 1
fi"""
teardown_command = "true"

# ── Protected removal ────────────────────────────────────────────
# Move one finished worktree into the trash. <dir> is the worktree path
# exactly as dispatched; <repo-id> is the caller's repository identity
# from `verify`. Gates, all required:
#
#   1. The target may not resolve inside the caller's checkout, contain
#      it, or be its VCS ancestor/descendant — you cannot trash the tree
#      you sit in.
#   2. The target must BE a checkout root (fossil `local-root` / git
#      `--show-toplevel` must resolve to the target itself — VCS identity
#      otherwise walks up and would inherit an enclosing checkout's).
#   3. Its repository identity must equal <repo-id>.
#
# The trash directory is created beside the worktree (its parent), so the
# layout the user's session lifecycle chose is respected and the trash
# stays findable regardless of where later sessions sit.
[[session_lifecycle.script]]
name = "trash-stage"
description = "Move a finished worktree into the autocoder trash (guarded)"
setup_command = """
ADIR="$(cd <dir> && pwd)" || { echo "<dir> does not exist" >&2; exit 1; }
SELF="$(pwd -P)"
SELF="${SELF%/}"; ADIR="${ADIR%/}"
case "$ADIR/" in "$SELF"/*) echo "<dir> is inside this checkout" >&2; exit 1;; esac
case "$SELF/" in "$ADIR"/*) echo "<dir> contains this checkout" >&2; exit 1;; esac
if [ -f <dir>/.fslckout ]; then
  ROOT="$(cd <dir> && fossil info 2>/dev/null | sed -n 's/^local-root: *//p')"
  WID="$(cd <dir> && fossil info 2>/dev/null | sed -n 's/^project-code: *//p')"
elif [ -e <dir>/.git ]; then
  ROOT="$(git -C <dir> rev-parse --path-format=absolute --show-toplevel 2>/dev/null)"
  WID="$(git -C <dir> rev-parse --path-format=absolute --git-common-dir 2>/dev/null)"
else
  echo "<dir> is not an open checkout" >&2; exit 1
fi
ADIR="${ADIR%/}"; ROOT="${ROOT%/}"
if [ -z "$ROOT" ] || [ "$ROOT" != "$ADIR" ]; then
  echo "<dir> is not itself a checkout root" >&2; exit 1
fi
if [ -z "$WID" ] || [ "$WID" != <repo-id> ]; then
  echo "<dir> does not belong to this repository" >&2; exit 1
fi
PARENT="$(dirname "$ADIR")"
mkdir -p "$PARENT/.jinn-autocoder-trash"
mv "$ADIR" "$PARENT/.jinn-autocoder-trash/" && echo "trashed: $ADIR"
"""
teardown_command = "true"

# The purge. No placeholders — rendered verbatim, un-aimable. The caller
# must sit where the trash lives (the shared parent of the checkouts).
# Called at the start of a run, never at its end, so the orchestrator
# that filled the trash never empties it in the same breath.
[[session_lifecycle.script]]
name = "trash-purge"
description = "Delete the autocoder trash (last run's archived worktree copies)"
setup_command = "rm -rf .jinn-autocoder-trash"
teardown_command = "true"
