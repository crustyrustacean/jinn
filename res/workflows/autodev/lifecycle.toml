# Session lifecycle scripts for autodev runs.
#
# One script per SCM. The orchestrator runs them with the `run_lifecycle`
# tool, on the implementor session it just attached:
#
#   setup    — give the implementor its own checkout on its own branch,
#              branched from the FEATURE BRANCH (the one the human started
#              the run on, which is the branch the orchestrator's own
#              checkout has checked out). The session moves into it.
#   teardown — merge the implementor's work back onto that feature
#              branch, then remove the checkout and the branch. The merge
#              IS the landing; there is no separate integration branch.
#
# Arguments (the runner substitutes and shell-quotes them; every
# placeholder in a command MUST have a matching argument or setup fails):
#
#   git    branch, parent
#   fossil branch, parent, repo, dir
#
# The two scripts take different arguments on purpose. Git needs no repo
# or dir: a worktree belongs to the repository it is created from, and
# the setup runs in the orchestrator's own checkout, which is already
# inside that repository. Fossil needs both — it opens a checkout from a
# repository FILE (`<repo>.fossil`) at a directory you name (`<dir>`).
#
# The setup MUST branch from the feature branch, not from whatever the
# repository's main checkout happens to be on. That is why the git setup
# does not `cd` to the repository first: `git worktree add` branches from
# the HEAD of the directory it runs in, and the main checkout is usually
# on the mainline. `<parent>` is passed as the explicit start-point so the
# base can never be guessed.
#
# The teardown merges back FROM the worktree that has `<parent>` checked
# out — git allows a branch to be checked out in only one worktree, so
# that worktree is the orchestrator's seat, wherever it lives. The git
# teardown finds it by branch name rather than by path, so the layout
# does not matter (the seat may be the main checkout or a linked
# worktree of it).
#
# Teardown ordering is load-bearing: everything before the checkout is
# removed and the branch is deleted is retryable (a re-run's merges are
# no-ops), so the conflict gate fires EARLY and nothing irreversible
# happens on a conflicted teardown. A failed teardown leaves the
# implementor session and checkout intact; the orchestrator sends the
# merge-fix dispatch and re-issues teardown on the same session.
#
# Never wrap a command in `bash -c` here: the runner already executes
# every lifecycle command through `bash -c`, so a nested wrapper spawns
# a second shell for nothing and its single quotes clash with the
# shell-quoted values the runner substitutes for placeholders.

# ── Fossil ────────────────────────────────────────────────────────
# <repo>   repository file name, without extension (e.g. `jinn` for
#          `jinn.fossil`) — the file sits beside the checkout.
# <dir>    the checkout directory to create, beside the orchestrator's own
#          checkout (e.g. `myapp-issue-007`).
# <branch> the implementor's branch name, derived from the parent so runs
#          on different feature branches can never collide:
#          `<parent>-issue-007`, never a fixed prefix.
# <parent> the feature branch — the branch the orchestrator's checkout
#          has checked out. Recorded at setup and replayed by teardown
#          from the session's stored coordinates.
[[session_lifecycle.script]]
name = "autodev implementor (fossil)"
description = "Branch the orchestrator's branch; teardown merges back into it"
setup_command = """
mkdir -p <dir> && cd <dir> && fossil open ../<repo>.fossil && \
fossil branch new <branch> <parent> && fossil update <branch> && echo <dir>
"""
teardown_command = """
fossil merge <parent> && \
if [ -n "$(grep -rl '^<<<<<<<' --exclude-dir=target . 2>/dev/null)" ]; then \
  echo "TEARDOWN-CONFLICT: merge markers present; resolve and re-run" >&2; exit 1; \
fi && \
fossil addremove && fossil commit -m 'Bring in latest <parent>' ; \
fossil update <parent> && fossil merge <branch> && \
fossil addremove && fossil commit -m 'Merge <branch>' && \
fossil branch close <branch> && cd .. && rm -rfv <dir>
"""

# ── Git ───────────────────────────────────────────────────────────
# <branch> the implementor's branch name, derived from the parent:
#          `<parent>-issue-007`.
# <parent> the feature branch — the branch the orchestrator's checkout
#          has checked out.
#
# No <repo>, no <dir>: the worktree is created beside the orchestrator's
# own checkout and named after <branch>, and the setup runs in that
# checkout, so the repository needs no naming and no directory needs
# choosing.
[[session_lifecycle.script]]
name = "autodev implementor (git)"
description = "Worktree branched from the orchestrator's branch; teardown merges back into it"
setup_command = "git worktree add -b <branch> ../<branch> <parent> && cd .. && echo $(pwd)/<branch>"
teardown_command = """
git add -A && (git diff --cached --quiet || git commit -q -m "auto-commit at teardown") && \
git merge <parent> && \
if git diff --name-only --diff-filter=U | grep -q .; then echo "TEARDOWN-CONFLICT: unresolved paths; resolve and re-run" >&2; exit 1; fi && \
seat="$(git worktree list --porcelain | awk -v b="branch refs/heads/<parent>" '/^worktree /{p=$2} $0==b{print p; exit}')" && \
[ -n "$seat" ] || { echo "TEARDOWN-NOSEAT: no worktree has <parent> checked out" >&2; exit 1; } && \
cd "$seat" && git merge --no-ff <branch> -m "Merge <branch>" && \
git worktree remove ../<branch> && git branch -D <branch>
"""
