# Session lifecycle scripts for autodev runs.
#
# One script per SCM. The orchestrator runs them with the `run_lifecycle`
# tool, on the implementor session it just attached:
#
#   setup    — give the implementor its own checkout on its own branch,
#              branched from <parent> — the orchestrator's branch (the
#              branch the orchestrator's own checkout has checked out,
#              and the branch every implementor merges back into). The
#              session is moved into the new checkout.
#   teardown — commit any loose work, merge <parent> into the
#              implementor's branch (so conflicts surface in the
#              implementor's checkout, where its session can resolve
#              them), then merge the branch back into the orchestrator's
#              branch, remove the implementor's checkout, delete the
#              branch. The merge-back IS the landing; there is no
#              separate integration branch.
#
# Arguments (the runner substitutes and shell-quotes them; every
# placeholder in a command MUST have a matching argument or setup fails):
#
#   git    branch, parent, orchestrator_dir
#   fossil branch, parent, repo, dir
#
# <orchestrator_dir> is the orchestrator session's own checkout, passed
# as an absolute path. The merge-back has to run there: the orchestrator's
# branch is checked out in that worktree, and git only lets a worktree
# move the branch it has checked out. Setup records the argument with
# the others and teardown replays the recording. Every git path is
# anchored on it, so the scripts never depend on which directory the
# shell runs in.
#
# Teardown's only conflict point is the first merge, and it runs in the
# IMPLEMENTOR'S checkout on purpose: a conflict stops the chain there
# (TEARDOWN-CONFLICT) with the orchestrator's checkout untouched, and
# the fix loop stays intact — the implementor resolves in its own tree,
# commits, and teardown is re-issued. The second merge cannot conflict:
# the first already made the branch a descendant of <parent>, so it
# fast-forwards. `git branch -d` (not -D) double-checks the landing; it
# refuses to delete a branch the merge-back did not actually take.
#
# The setup asserts <parent> is what the orchestrator's checkout has
# checked out before it creates anything (SETUP-BAD-PARENT). Everything
# downstream branches from and merges into that assumption, so a wrong
# invocation must die loudly before any state exists.
#
# Never wrap a command in `bash -c` here: the runner already executes
# every lifecycle command through `bash -c`, so a nested wrapper spawns
# a second shell for nothing and its single quotes clash with the
# shell-quoted values the runner substitutes for placeholders.

# ── Fossil ────────────────────────────────────────────────────────
# <repo>   repository file name, without extension (e.g. `jinn` for
#          `jinn.fossil`) — the file sits beside the checkout.
# <dir>    the checkout directory to create, beside the orchestrator's own
#          checkout (e.g. `myapp-issue-007`).
# <branch> the implementor's branch name, derived from the parent so runs
#          on different feature branches can never collide:
#          `<parent>-issue-007`, never a fixed prefix.
# <parent> the feature branch — the branch the orchestrator's checkout
#          has checked out. Recorded at setup and replayed by teardown
#          from the session's stored coordinates.
[[session_lifecycle.script]]
name = "autodev implementor (fossil)"
description = "Branch the orchestrator's branch; teardown merges back into it"
setup_command = """
mkdir -p <dir> && cd <dir> && fossil open ../<repo>.fossil && \
fossil branch new <branch> <parent> && fossil update <branch> && echo <dir>
"""
teardown_command = """
fossil merge <parent> && \
if [ -n "$(grep -rl '^<<<<<<<' --exclude-dir=target . 2>/dev/null)" ]; then \
  echo "TEARDOWN-CONFLICT: merge markers present; resolve and re-run" >&2; exit 1; \
fi && \
fossil addremove && fossil commit -m 'Bring in latest <parent>' ; \
fossil update <parent> && fossil merge <branch> && \
fossil addremove && fossil commit -m 'Merge <branch>' && \
fossil branch close <branch> && cd .. && rm -rfv <dir>
"""

# ── Git ───────────────────────────────────────────────────────────
# <branch>            the implementor's branch name, derived from the
#                     parent: `<parent>-issue-007`.
# <parent>            the orchestrator's branch — the branch the human
#                     started the run on; the branch every implementor
#                     merges back into.
# <orchestrator_dir>  the orchestrator session's own checkout, absolute
#                     path — the merge-back runs there, because the
#                     orchestrator's branch is the branch that checkout
#                     has checked out.
[[session_lifecycle.script]]
name = "autodev implementor (git)"
description = "Worktree branched from the orchestrator's branch; teardown merges back into it"
setup_command = "[ \"$(git -C <orchestrator_dir> branch --show-current)\" = \"<parent>\" ] || { echo \"SETUP-BAD-PARENT: <parent> is not the branch checked out at <orchestrator_dir>\" >&2; exit 1; } && git -C <orchestrator_dir> worktree add -b <branch> ../<branch> <parent> && echo \"<orchestrator_dir>/../<branch>\""
teardown_command = """
git add -A && git commit -q -m "auto-commit at teardown" ; \
git merge --no-edit <parent> || { echo "TEARDOWN-CONFLICT: resolve in this checkout, commit, re-issue teardown" >&2; exit 1; } && \
git -C <orchestrator_dir> merge --no-edit <branch> && \
git -C <orchestrator_dir> worktree remove ../<branch> && \
git -C <orchestrator_dir> branch -d <branch>
"""
