# Session lifecycle scripts for autodev runs.
#
# Applied via the `run_lifecycle` tool. The implementor session is created
# by `load_attendant` on attendants/implementor.toml; this script then
# seats it: setup branches the ORCHESTRATOR'S
# CURRENT BRANCH (the feature branch the human started the run on), opens
# the implementor's checkout, and moves the session there; teardown merges
# the implementor's work back onto that same branch, closes the checkout,
# and removes it. The teardown merge IS the landing — there is no separate
# integration branch.
#
# One script per SCM. They are the defaults from jinn.toml ("fossil branch
# checkout" / "git worktree") adapted for autodev: a third <parent>
# parameter replaces the hardcoded main/trunk, so the run branches from
# and lands on the feature branch; teardown gains a conflict gate so a
# conflicted merge never reaches the irreversible steps; git's merge-back
# uses --no-ff to keep branch ancestry.
#
# Teardown ordering is load-bearing: everything before `branch close` /
# `branch -D` is retryable (a re-run's merges are no-ops), so the conflict
# gate fires EARLY and nothing irreversible happens on a conflicted
# teardown. A failed teardown leaves the implementor session and checkout
# intact; the orchestrator sends the merge-fix dispatch and re-issues
# teardown on the same session.
#
# Never wrap a command in `bash -c` here: the runner already executes
# every lifecycle command through `bash -c`, so a nested wrapper spawns
# a second shell for nothing and its single quotes clash with the
# shell-quoted values the runner substitutes for placeholders.

# ── Fossil ────────────────────────────────────────────────────────
# <repo>   repository file name, without extension (e.g. `jinn`)
# <branch> the implementor's branch name (the orchestrator names it per
#          attach, derived from the parent so runs on different feature
#          branches can never collide: `<parent>-issue-007`, never a
#          fixed prefix)
# <parent> the orchestrator's current branch — the feature branch. Recorded
#          at setup and replayed by teardown from the session's stored
#          coordinates.
[[session_lifecycle.script]]
name = "autodev implementor (fossil)"
description = "Branch the orchestrator's branch; teardown merges back into it"
setup_command = """
mkdir -p <dir> && cd <dir> && fossil open ../<repo>.fossil && \
fossil branch new <branch> <parent> && fossil update <branch> && echo <dir>
"""
teardown_command = """
fossil merge <parent> && \
if [ -n "$(grep -rl '^<<<<<<<' --exclude-dir=target . 2>/dev/null)" ]; then \
  echo "TEARDOWN-CONFLICT: merge markers present; resolve and re-run" >&2; exit 1; \
fi && \
fossil addremove && fossil commit -m 'Bring in latest <parent>' ; \
fossil update <parent> && fossil merge <branch> && \
fossil addremove && fossil commit -m 'Merge <branch>' && \
fossil branch close <branch> && cd .. && rm -rfv <dir>
"""

# ── Git ───────────────────────────────────────────────────────────
# <repo>   the repo directory name (the worktree's parent holds the repo
#          and the worktree as siblings, per the default script's layout)
# <branch> the implementor's branch name
# <parent> the orchestrator's current branch — the feature branch
[[session_lifecycle.script]]
name = "autodev implementor (git)"
description = "Worktree branched from the orchestrator's branch; teardown merges back into it"
setup_command = "cd <repo> && git worktree add -b <branch> ../<branch> && cd .. && echo $(pwd)/<branch>"
teardown_command = """git add -A && (git diff --cached --quiet || git commit -q -m "auto-commit at teardown") && git merge <parent> && if git diff --name-only --diff-filter=U | grep -q .; then echo "TEARDOWN-CONFLICT: unresolved paths; resolve and re-run" >&2; exit 1; fi && cd ../<repo> && git merge --no-ff <branch> -m "Merge <branch>" && git worktree remove ../<branch> && git branch -D <branch>"""
