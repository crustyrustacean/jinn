[package]
name = "jinn-e2e"
version.workspace = true
edition.workspace = true

[[test]]
name = "e2e"
harness = false

[dependencies]
jinn = { path = "../.." }
cucumber = { workspace = true }
tokio = { workspace = true }
jinn-tui = { workspace = true }
jinn-domain = { workspace = true }
jinn-plugin = { workspace = true }
crossterm = { workspace = true }
ratatui-which-key = { workspace = true }
ratatui-spatial-splits = { workspace = true }
tempfile = { workspace = true }
kanal = { workspace = true }
serde_json = { workspace = true }
# These are needed because jinn-services exposes types/traits from these crates
# and e2e tests must match those exact types.

[lints.clippy]
# Test-only crate: relax production lints.
pedantic = { level = "allow", priority = -1 }
result_large_err = "allow"

[lints.rust]
missing_docs = "allow"
