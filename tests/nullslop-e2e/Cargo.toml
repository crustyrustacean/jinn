[package]
name = "nullslop-e2e"
version = "0.1.0"
edition = "2024"

[[test]]
name = "e2e"
harness = false

[dependencies]
cucumber = { workspace = true }
tokio = { workspace = true }
nullslop-tui = { workspace = true }
nullslop-protocol = { workspace = true, features = ["which-key"] }
nullslop-services = { workspace = true }
nullslop-providers = { workspace = true }
nullslop-actor-host = { workspace = true }
nullslop-component = { workspace = true }
crossterm = { workspace = true }
ratatui-which-key = { workspace = true }
ratatui-spatial-splits = { workspace = true }
nullslop-core = { workspace = true }
nullslop-actor = { workspace = true }
nullslop-intent = { workspace = true }
nsslice-context-protocol = { workspace = true }
nsslice-llm = { workspace = true }
nsslice-session-management = { workspace = true }
nsslice-session-management-protocol = { workspace = true }
tempfile = { workspace = true }
kanal = { workspace = true }
nsslice-tools = { workspace = true }

[lints.clippy]
# Test-only crate: relax production lints.
pedantic = { level = "allow", priority = -1 }
result_large_err = "allow"

[lints.rust]
missing_docs = "allow"
