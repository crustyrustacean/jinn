[package]
edition = "2024"
name = "tiktoken"
version = "3.5.1"
authors = [
    "GOLIA株式会社",
    "Li Hao <lihao@golia.jp>",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A high-performance pure-Rust implementation of OpenAI's tiktoken BPE tokenizer"
homepage = "https://github.com/goliajp/rust-tiktoken"
documentation = "https://docs.rs/tiktoken"
readme = "README.md"
keywords = [
    "tiktoken",
    "tokenizer",
    "bpe",
    "openai",
    "gpt",
]
categories = [
    "text-processing",
    "algorithms",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/goliajp/rust-tiktoken"

[features]
default = []
parallel = ["rayon"]

[lib]
name = "tiktoken"
path = "src/lib.rs"

[dependencies.base64]
version = "^0.22"

[dependencies.rayon]
version = "^1"
optional = true

[dependencies.regex]
version = "^1"

[dependencies.rustc-hash]
version = "^2"

[dependencies.ruzstd]
version = "^0.8"
